<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鄰里守望 表單</title>
<style>
  :root { --bg:#f3f6f3; --card:#fff; --text:#1c2b25; --muted:#5f6c65; --line:#ccd8d1;
          --accent:#13795b; --ok:#18765a; --danger:#b52e42; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171c; --card:#1c242c; --text:#e8edf2; --muted:#98a4b0; --line:#34414e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;
         font-size:18px; line-height:1.5; }
  header { background:#183a30; color:#fff; padding:18px 16px; border-bottom:4px solid var(--accent); }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; font-size:15px; opacity:.92; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .me-code { margin-bottom:14px; padding:14px 16px; border:2px solid var(--accent); border-radius:10px; background:var(--card); line-height:1.6; }
  .me-code strong { display:block; font-size:24px; letter-spacing:.08em; }
  button.armed { background:var(--danger) !important; color:#fff !important; border-color:var(--danger) !important; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:0 4px 18px rgba(27,48,39,.06); }
  label.field { display:block; margin:16px 0 0; font-weight:700; }
  label.field small { font-weight:400; color:var(--muted); margin-left:6px; }
  input[type=text], input[type=tel], input[type=number], select, textarea {
    width:100%; margin-top:6px; padding:14px; font-size:18px; border:2px solid var(--line); border-radius:7px;
    background:var(--bg); color:var(--text); font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:96px; resize:vertical; }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  @media (max-width:420px) { .checks { grid-template-columns:1fr; } }
  .checks label { display:flex; align-items:center; gap:8px; padding:12px; border:2px solid var(--line);
                  border-radius:7px; font-weight:600; transition:border-color .15s, background .15s; }
  .checks label:has(input:checked), .choices label:has(input:checked) { border-color:var(--accent); background:#e8f3ee; }
  /* WCAG 2.5.8：勾選框本身也要 >=24px，居民多半在手機上單手點。 */
  /* flex-shrink:0：不加的話窄螢幕會把勾選框壓扁，寧可讓標籤換行。 */
  .checks input { width:26px; height:26px; flex-shrink:0; }
  button.go { width:100%; margin-top:22px; padding:16px; font-size:20px; font-weight:700; color:#fff;
              background:var(--ok); border:0; border-radius:7px; cursor:pointer; }
  button.go[disabled] { opacity:.6; }
  .err { margin-top:14px; padding:12px; border-radius:7px; background:#fff0f2; color:var(--danger); font-weight:600; }
  .done { text-align:center; padding:24px 8px; }
  .done h2 { color:var(--ok); margin:0 0 10px; }
  .done pre { text-align:left; white-space:pre-wrap; font-family:inherit; background:var(--bg);
              padding:12px; border-radius:10px; font-size:16px; }
  .hint { color:var(--muted); font-size:14px; margin-top:6px; }
  .privacy { display:flex; align-items:flex-start; gap:10px; margin-top:20px; color:var(--muted); font-size:15px; }
  .privacy input { width:24px; height:24px; flex:0 0 24px; margin-top:1px; }
  .privacy a { color:var(--accent); }
  .task { background:var(--bg); border:2px solid var(--line); border-radius:7px; padding:12px; margin-top:4px; }
  .task strong { display:block; margin-bottom:2px; }
  .choices label { display:block; padding:12px; margin-top:8px; border:2px solid var(--line); border-radius:7px; font-weight:600; }
  .choices small { display:block; font-weight:400; color:var(--muted); margin-left:34px; }
  /* WCAG 2.5.8：單選鈕本身也要 >=24px，居民多半在手機上單手點。 */
  .choices input { width:26px; height:26px; margin-right:8px; vertical-align:middle; }
  .me-sec { margin-top:20px; }
  .me-sec h2 { font-size:19px; margin:0 0 8px; }
  .me-row { border:2px solid var(--line); border-radius:10px; padding:12px; margin-top:8px; }
  .me-row .meta { color:var(--muted); font-size:15px; }
  .me-row button, .me-btn { margin-top:8px; padding:10px 14px; font-size:16px; border-radius:8px; border:2px solid var(--line);
                            background:var(--card); color:var(--text); font-weight:600; }
  .me-row button.danger { border-color:#c0392b; color:#c0392b; }
  .me-empty { color:var(--muted); }
  .code { font-size:34px; font-weight:800; letter-spacing:6px; text-align:center; padding:12px; background:var(--bg);
          border-radius:10px; margin-top:8px; }
  .is-hidden { display:none !important; }
</style>
<link rel="stylesheet" href="/static/feel.css">
<script src="/static/feel.js"></script>
</head>
<body>
<header>
  <h1 id="title">鄰里守望</h1>
  <p id="subtitle">請填寫下列資料</p>
</header>
<main>
  <div class="card">
    <div id="error-top" class="err is-hidden" role="alert"></div>
    <form id="form" novalidate>
      <div id="task-box" class="task is-hidden"></div>
      <label class="field profile">姓名
        <input type="text" id="name" maxlength="100" autocomplete="name">
      </label>
      <label class="field profile">電話<small>（選填）</small>
        <input type="tel" id="phone" maxlength="40" autocomplete="tel" inputmode="tel">
      </label>
      <label class="field profile">地址
        <input type="text" id="address" maxlength="200" autocomplete="street-address">
      </label>

      <div data-kind="need">
        <label class="field">需要什麼？<small>（可多選）</small></label>
        <div class="checks" id="need-types"></div>
        <label class="field">家裡幾個人？
          <input type="number" id="people" min="1" max="99" inputmode="numeric">
        </label>
        <label class="field">有多急？
          <select id="urgent"><option value="0">一般</option><option value="1">很急，請優先處理</option></select>
        </label>
        <label class="field">想告訴志工的話<small>（選填）</small>
          <textarea id="note" maxlength="500"></textarea>
        </label>
        <p class="hint" style="color:var(--danger)">有生命危險請直接撥 119，不要等表單。</p>
      </div>

      <div data-kind="res">
        <label class="field">物資種類
          <select id="rtype">
            <option value="water">飲用水</option><option value="food">食物</option>
            <option value="first_aid">藥品／急救用品</option><option value="vehicle">交通工具</option>
            <option value="shelter">空間／庇護所</option><option value="tool">工具</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label class="field">物資名稱<small>（選填）</small>
          <input type="text" id="resource_name" maxlength="100">
        </label>
        <label class="field">數量
          <input type="text" id="quantity" maxlength="60">
        </label>
      </div>

      <div data-kind="report">
        <label class="field">現場狀況</label>
        <div class="choices" id="report-outcomes">
          <label><input type="radio" name="outcome" value="delivered" checked> ✅ 已送達，任務完成</label>
          <label><input type="radio" name="outcome" value="issue"> ⚠️ 遇到狀況（先不結案）</label>
          <label><input type="radio" name="outcome" value="cannot_go"> ❌ 無法前往，請改派他人</label>
        </div>
        <label class="field">說明<small id="report-note-hint">（選填）</small>
          <textarea id="report_note" maxlength="500"></textarea>
        </label>
      </div>

      <div data-kind="apply">
        <label class="field">可以服務的區域<small>（選填）</small>
          <input type="text" id="service_area" maxlength="200">
        </label>
      </div>

      <label class="privacy">
        <input type="checkbox" id="privacy-ack">
        <span>我已閱讀<a href="/privacy" target="_blank" rel="noopener">個人資料告知事項</a>，並同意為社區照護、緊急聯繫與物資調度使用上述資料。</span>
      </label>

      <div id="error" class="err is-hidden" role="alert"></div>
      <button class="go" id="submit" type="submit">送出</button>
    </form>

    <div id="me" class="is-hidden"></div>

    <div id="done" class="done is-hidden">
      <h2>✅ 已送出</h2>
      <pre id="done-text"></pre>
      <p class="hint">結果也已經傳到您的 LINE 聊天室，可以關閉這個頁面了。</p>
    </div>
  </div>
</main>

<script>
(function () {
  var KIND = location.pathname.split('/').filter(Boolean).pop();
  var QUERY = new URLSearchParams(location.search);
  var FRAGMENT = new URLSearchParams(location.hash.replace(/^#/, ''));
  var TOKEN = FRAGMENT.get('t') || QUERY.get('t') || '';
  var NEED_ID = FRAGMENT.get('n') || QUERY.get('n') || '';
  // 連結失效要照實說，不能被後面的 catch 蓋成「無法連線」。
  function linkError(text) { var e = new Error(text); e.link = true; return e; }
  function failText(e) { return e && e.link ? e.message : '無法連線，請檢查網路後重新開啟表單。'; }
  var SESSION_READY = TOKEN ? fetch('/f/api/session', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN })
  }).then(function (r) {
    r.text();  // 讀完回應，連線才算結束
    if (!r.ok) throw linkError('這個表單連結已過期或無效，請回到 LINE 重新開啟表單。');
    history.replaceState(null, '', location.pathname + (NEED_ID ? '?n=' + encodeURIComponent(NEED_ID) : ''));
    TOKEN = '';
  }) : Promise.resolve();
  var META = {
    need:  { title: '📋 申請物資', sub: '填好送出，志工會盡快協助', action: '/f/api/need', btn: '送出申請' },
    res:   { title: '📦 登記可提供物資', sub: '謝謝您願意分享物資', action: '/f/api/resource', btn: '送出登記' },
    report: { title: '📝 回報任務現況', sub: '寫下現場狀況，管理員會收到通知', action: '/f/api/report', btn: '送出回報' },
    me:    { title: '📁 我的紀錄', sub: '需求、家人、物資與任務', action: '', btn: '' },
    profile: { title: '📇 我的資料', sub: '留下聯絡方式，志工才找得到您', action: '/f/api/profile', btn: '儲存' },
    apply: { title: '🙋 志工申請', sub: '謝謝您願意幫忙，管理員審核後會通知您', action: '/f/api/apply', btn: '送出申請' }
  };
  var TYPES = [['water','💧 飲用水'],['food','🍱 食物'],['first_aid','🩹 藥品／急救'],['shelter','🏠 庇護所'],['vehicle','🚗 交通接送']];
  var m = META[KIND] || META.need;
  var $ = function (id) { return document.getElementById(id); };

  document.title = m.title;
  $('title').textContent = m.title;
  $('subtitle').textContent = m.sub;
  $('submit').textContent = m.btn;
  Array.prototype.forEach.call(document.querySelectorAll('[data-kind]'), function (el) {
    el.classList.toggle('is-hidden', el.getAttribute('data-kind') !== KIND);
  });
  if (KIND === 'need') {
    TYPES.forEach(function (t) {
      var label = document.createElement('label');
      var box = document.createElement('input');
      box.type = 'checkbox'; box.value = t[0];
      label.appendChild(box); label.appendChild(document.createTextNode(t[1]));
      $('need-types').appendChild(label);
    });
  }
  if (KIND === 'apply') { $('address').closest('label').classList.add('is-hidden'); }
  if (KIND === 'report') {
    Array.prototype.forEach.call(document.querySelectorAll('.profile'), function (e) { e.classList.add('is-hidden'); });
  }
  function syncReportHint() {
    var v = (document.querySelector('input[name=outcome]:checked') || {}).value;
    $('report-note-hint').textContent = v === 'issue' ? '（必填：請寫下發生了什麼事）' : '（選填）';
  }
  if (KIND === 'report') {
    Array.prototype.forEach.call(document.querySelectorAll('input[name=outcome]'), function (r) {
      r.addEventListener('change', syncReportHint);
    });
  }

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function post(path, extra) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify(Object.assign({ t: TOKEN }, extra || {})) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  function section(title) {
    var s = el('div', null, 'me-sec'); s.appendChild(el('h2', title)); $('me').appendChild(s); return s;
  }
  // 需要確認的動作不跳視窗：第一下把按鈕換成「再按一次確認」，4 秒內再按才送出。
  var shownCode = null;
  function action(row, label, path, extra, danger, confirmText) {
    var b = el('button', label, danger ? 'danger' : ''); b.type = 'button';
    var armed = null;
    function disarm() { clearTimeout(armed); armed = null; b.textContent = label; b.classList.remove('armed'); }
    b.addEventListener('click', function () {
      if (confirmText && !armed) {
        b.textContent = '再按一次確認';
        b.classList.add('armed');
        b.setAttribute('aria-label', confirmText);
        armed = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      b.disabled = true;
      post(path, extra).then(function (res) {
        if (!res.ok) { showError(res.d.detail || res.d.error || '操作失敗'); b.disabled = false; return; }
        if (res.d.code) shownCode = res.d.code;
        loadMe();
      });
    });
    row.appendChild(b);
  }
  function loadMe() {
    fetch('/f/api/me').then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        var box = $('me'); box.innerHTML = '';
        $('error').classList.add('is-hidden');
        if (!res.ok) { showError(res.d.detail || res.d.error || '連結無效'); return; }
        var d = res.d;
        if (shownCode) {
          var code = el('div', null, 'me-code');
          code.appendChild(el('strong', '綁定碼 ' + shownCode));
          code.appendChild(el('div', '請家人傳「綁定 ' + shownCode + '」給機器人，24 小時內有效。'));
          box.appendChild(code);
        }
        var s1 = section('我的需求');
        if (!d.needs.length) s1.appendChild(el('div', '還沒有提出過需求', 'me-empty'));
        d.needs.forEach(function (n) {
          var r = el('div', null, 'me-row');
          r.appendChild(el('strong', n.type + '　' + n.status_zh));
          r.appendChild(el('div', n.created + (n.description ? '　' + n.description : ''), 'meta'));
          if (n.can_cancel) action(r, '取消這筆需求', '/f/api/cancel_need', { target_id: n.id }, true, '確定取消這筆需求？');
          s1.appendChild(r);
        });
        var s2 = section('我的家人');
        if (!d.family.length) s2.appendChild(el('div', '還沒有綁定家人。產生綁定碼後，請家人傳「綁定 碼」給機器人。', 'me-empty'));
        d.family.forEach(function (f) {
          var r = el('div', null, 'me-row'); r.appendChild(el('strong', f.name));
          action(r, '解除綁定', '/f/api/unbind', { target_id: f.id }, true, '確定解除與 ' + f.name + ' 的綁定？');
          s2.appendChild(r);
        });
        var inv = el('button', '產生家人綁定碼', 'me-btn'); inv.type = 'button';
        inv.addEventListener('click', function () {
          post('/f/api/invite').then(function (res2) {
            if (!res2.ok) { showError(res2.d.detail || '產生失敗'); return; }
            var c = el('div', res2.d.code, 'code'); s2.appendChild(c);
            s2.appendChild(el('div', '請家人傳「綁定 ' + res2.d.code + '」給機器人，24 小時內有效。', 'meta'));
            if (res2.d.link) {
              var a = el('a', '把這個連結傳給家人，點開就會綁定', 'me-btn'); a.href = res2.d.link;
              a.style.display = 'inline-block'; a.style.textDecoration = 'none'; s2.appendChild(a);
            }
            inv.disabled = true;
          });
        });
        s2.appendChild(inv);
        if (d.cared.length) {
          var s3 = section('我照顧的長輩');
          d.cared.forEach(function (c) {
            var r = el('div', null, 'me-row'); r.appendChild(el('strong', c.name));
            action(r, '解除綁定', '/f/api/unbind', { target_id: c.id }, true, '確定解除與 ' + c.name + ' 的綁定？');
            s3.appendChild(r);
          });
        }
        if (d.is_staff) {
          var s4 = section('我的任務');
          if (!d.tasks.length) s4.appendChild(el('div', '目前沒有進行中的任務', 'me-empty'));
          d.tasks.forEach(function (t) {
            var r = el('div', null, 'me-row');
            r.appendChild(el('strong', t.description));
            r.appendChild(el('div', '地點：' + t.address + (t.accepted ? '　🙋 已接單' : ''), 'meta'));
            var a = el('a', '📝 回報現況', 'me-btn'); a.href = t.report_url; a.style.display = 'inline-block';
            a.style.textDecoration = 'none'; r.appendChild(a);
            s4.appendChild(r);
          });
          var s5 = section('我的物資');
          if (!d.resources.length) s5.appendChild(el('div', '還沒有登記物資', 'me-empty'));
          d.resources.forEach(function (x) {
            var r = el('div', null, 'me-row');
            r.appendChild(el('strong', x.name + (x.quantity ? '　' + x.quantity : '')));
            r.appendChild(el('div', x.available ? '可提供' : '已派出或保留中', 'meta'));
            if (x.available) action(r, '撤回這份物資', '/f/api/withdraw_resource', { target_id: x.id }, true, '確定撤回這份物資？');
            s5.appendChild(r);
          });
        }
      }).catch(function () { showError('無法連線，請稍後再試。'); });
  }

  function showError(text) {
    var box = $('error');
    box.textContent = text;
    box.classList.remove('is-hidden');
  }

  // 連結失效這類錯誤會讓整份表單都送不出去。訊息若留在欄位後面，
  // 使用者會把整份填完、捲到底才發現白做。放最上面並停用欄位。
  function blockForm(text) {
    var box = $('error-top');
    box.textContent = text;
    box.classList.remove('is-hidden');
    $('error').classList.add('is-hidden');
    var f = $('form');
    f.querySelectorAll('input, select, textarea, button').forEach(function (el) { el.disabled = true; });
    box.scrollIntoView({ block: 'nearest' });
  }

  if (KIND === 'me') {
    $('form').classList.add('is-hidden');
    $('me').classList.remove('is-hidden');
    SESSION_READY.then(loadMe).catch(function (e) { blockForm(failText(e)); });
    return;
  }

  SESSION_READY.then(function () { return fetch('/f/api/context' + (KIND === 'report' ? '?n=' + encodeURIComponent(NEED_ID) : '')); }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    if (!res.ok) { blockForm(res.d.detail || res.d.error || '表單連結無效'); return; }
    if (res.d.task) {
      var box = $('task-box');
      box.classList.remove('is-hidden');
      var t1 = document.createElement('strong'); t1.textContent = res.d.task.type + '｜' + res.d.task.status_zh;
      var t2 = document.createElement('div'); t2.textContent = '地點：' + (res.d.task.address || '地址未填');
      var t3 = document.createElement('div'); t3.textContent = res.d.task.description || '';
      box.appendChild(t1); box.appendChild(t2); box.appendChild(t3);
    }
    if (res.d.name) $('name').value = res.d.name;
    if (res.d.phone) $('phone').value = res.d.phone;
    if (res.d.address) $('address').value = res.d.address;
    if (KIND === 'res' && !res.d.is_staff) { blockForm('只有志工可以登記物資，請先送出志工申請。'); }
    if (KIND === 'apply' && res.d.is_staff) { showError('您已經是志工，不用重新申請。'); $('submit').disabled = true; }
  }).catch(function (e) { blockForm(failText(e)); });

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('error').classList.add('is-hidden');
    if (!$('privacy-ack').checked) { showError('請先閱讀並確認個人資料告知事項。'); return; }
    var body = { t: TOKEN, name: $('name').value, phone: $('phone').value, address: $('address').value,
                 privacy_acknowledged: true };
    if (KIND === 'need') {
      body.types = Array.prototype.filter.call(document.querySelectorAll('#need-types input'), function (b) { return b.checked; })
                     .map(function (b) { return b.value; });
      if (!body.types.length) { showError('請至少勾選一項需要的物資。'); return; }
      body.people = $('people').value ? parseInt($('people').value, 10) : null;
      body.urgent = $('urgent').value === '1';
      body.note = $('note').value;
    } else if (KIND === 'res') {
      body.rtype = $('rtype').value; body.quantity = $('quantity').value; body.resource_name = $('resource_name').value;
      if (!body.quantity.trim()) { showError('請填寫數量。'); return; }
    } else if (KIND === 'report') {
      body = { t: TOKEN, need_id: NEED_ID, outcome: document.querySelector('input[name=outcome]:checked').value,
               note: $('report_note').value, privacy_acknowledged: true };
      if (body.outcome === 'issue' && !body.note.trim()) { showError('請寫下現場發生了什麼事。'); return; }
    } else if (KIND === 'profile') {
      if (!body.name.trim()) { showError('請填寫姓名。'); return; }
      // 沒有地址就轉不出座標，派遣演算法看不到這個人——所以這裡是必填。
      if (!body.address.trim()) { showError('請填寫地址，需要幫忙時志工才找得到您。'); return; }
    } else {
      body.service_area = $('service_area').value;
      if (!body.name.trim()) { showError('請填寫姓名。'); return; }
    }
    $('submit').disabled = true;
    fetch(m.action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          var detail = res.d.detail;
          showError(typeof detail === 'string' ? detail : (res.d.error || '送出失敗，請檢查欄位後再試一次。'));
          $('submit').disabled = false;
          return;
        }
        $('form').classList.add('is-hidden');
        $('done').classList.remove('is-hidden');
        $('done-text').textContent = res.d.message || '';
        window.scrollTo(0, 0);
      })
      .catch(function () { showError('無法連線，請稍後再試。'); $('submit').disabled = false; });
  });
})();
</script>
</body>
</html>
