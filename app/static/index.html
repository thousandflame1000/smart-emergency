<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄰里守望 · 照護現況</title>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
:root{--bg:#f3f6f3;--surface:#fff;--ink:#17201c;--muted:#68756e;--line:#d7dfda;--nav:#181d1b;--nav-muted:#9aa69f;--accent:#13795b;--danger:#c9364b;--warning:#9a6500;--ok:#18765a;--soft:#e8f2ed;--radius:6px;--sans:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
html{color-scheme:light}.embed .sidebar { display: none !important; }.embed .main{width:100%}
body{height:100vh;overflow:hidden;display:flex;background:var(--bg);color:var(--ink);font:14px var(--sans)}
button,input{font:inherit}.sidebar{width:220px;flex:0 0 220px;background:var(--nav);color:#eef4f0;display:flex;flex-direction:column;border-right:1px solid #303a35}
.brand{padding:20px;border-bottom:1px solid #303a35}.brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:4px;color:var(--nav-muted);font-size:11px}
.nav-label{padding:18px 16px 6px;color:#77847d;font:700 10px var(--mono);text-transform:uppercase}
.nav-item{width:100%;height:40px;padding:0 16px;border:0;border-left:3px solid transparent;background:none;color:var(--nav-muted);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.nav-item:hover{background:#202823;color:#fff}.nav-item.active{border-left-color:#77d6b5;background:#23322b;color:#9ae4c8}.nav-item svg{width:17px;height:17px}
.nav-link{text-decoration:none}.sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid #303a35}
.mode{width:100%;height:38px;border:1px solid #476457;border-radius:4px;background:#22342b;color:#9ae4c8;cursor:pointer}.mode.emergency{border-color:#8f3947;background:#3c2328;color:#ff9caa}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar h1{font-size:16px}.top-actions{display:flex;align-items:center;gap:10px}.stamp{color:var(--muted);font:12px var(--mono)}
.icon-btn,.action{height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px;padding:0 11px;cursor:pointer;text-decoration:none}.icon-btn:hover,.action:hover{border-color:var(--accent);color:var(--accent)}.icon-btn svg,.action svg{width:16px;height:16px}
.content{padding:22px 24px 32px;overflow:auto}.page{display:none}.page.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.metric{background:var(--surface);padding:15px 16px;min-height:95px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:8px;font:700 27px var(--mono)}.metric small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.metric.danger strong{color:var(--danger)}.metric.warning strong{color:var(--warning)}.metric.ok strong{color:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,1.3fr);gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.panel-head{height:48px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:13px}.panel-head input{width:190px;height:31px;border:1px solid var(--line);border-radius:4px;padding:0 9px;color:var(--ink)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{padding:10px 14px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;background:#f8faf8;white-space:nowrap}td{padding:11px 14px;border-top:1px solid var(--line);font-size:13px}tbody tr:hover{background:#f8faf8}.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border:1px solid;border-radius:3px;font-size:11px;font-weight:700}.b-ok{color:var(--ok);border-color:#9bcbbb;background:#edf8f4}.b-danger{color:var(--danger);border-color:#e8a8b2;background:#fff1f3}.b-warning{color:var(--warning);border-color:#e4c17a;background:#fff8e8}.b-muted{color:var(--muted);border-color:var(--line);background:#f4f6f4}
.alert-list{max-height:520px;overflow:auto}.alert-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.alert-row:first-child{border-top:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--warning)}.dot.high{background:var(--danger)}.alert-row strong{font-size:13px}.alert-row p{margin-top:3px;color:var(--muted);font-size:11px}.alert-row time{color:var(--muted);font:11px var(--mono)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}.page-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.page-heading h2{font-size:17px}.page-heading p{margin-top:4px;color:var(--muted);font-size:12px}
.trend-table td:not(:first-child),.trend-table th:not(:first-child){text-align:right;font-family:var(--mono)}
.ask{max-width:900px}.query-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px}.query-row input{height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px}.primary{height:40px;border:0;border-radius:4px;background:var(--accent);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.answer{padding:16px;border-top:1px solid var(--line);line-height:1.75;white-space:pre-wrap}.sources{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.metric{background:var(--surface);padding:15px 16px;min-height:95px;border:0;width:100%;text-align:left;font:inherit;color:inherit}
button.metric{cursor:pointer}button.metric:hover{background:var(--soft)}button.metric.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.chip b{font:700 11px var(--mono)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap;transition:opacity .12s ease}
/* 只有真的有游標的裝置才「滑過才顯示」；觸控裝置沒有 hover，
   藏起來就等於那些操作在手機上完全按不到。 */
@media (hover:hover) and (pointer:fine){
  .row-actions{opacity:0}
  tbody tr:hover .row-actions,tbody tr:focus-within .row-actions,.alert-row:hover .row-actions,.alert-row:focus-within .row-actions{opacity:1}
}
tbody tr[data-row]{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skel{display:block;height:11px;border-radius:3px;background:linear-gradient(90deg,#e9eeeb 25%,#f4f7f5 50%,#e9eeeb 75%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes slidein{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.chart-wrap{position:relative}
.crosshair{stroke:#9aa69f;stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;z-index:5;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--surface);box-shadow:0 4px 16px #17201c22;font-size:12px}
.tip b{display:block;margin-bottom:6px;font:700 11px var(--mono);color:var(--muted)}
.tip div{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.7}
.tip i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip span{font-family:var(--mono)}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#17201c5c;animation:fadein .12s ease}
.modal-card{width:min(400px,92vw);background:var(--surface);border-radius:7px;border:1px solid var(--line);box-shadow:0 12px 40px #17201c33;overflow:hidden}
.modal-card h3{padding:16px 18px 0;font-size:15px}.modal-card p{padding:9px 18px 16px;color:var(--muted);font-size:13px;line-height:1.7}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafcfb}
.danger-btn{height:34px;padding:0 15px;border:0;border-radius:4px;background:var(--danger);color:#fff;font-weight:700;cursor:pointer}
.mini{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini:hover{border-color:var(--accent);color:var(--accent)}.mini[disabled]{opacity:.4;cursor:not-allowed}.mini.warn:hover{border-color:var(--danger);color:var(--danger)}
.alert-row{grid-template-columns:10px 1fr auto auto}
[hidden]{display:none !important}
.scrim{position:fixed;inset:0;background:#17201c66;z-index:60}
.scrim:not([hidden]){animation:fadein .14s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--surface);border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 26px #17201c1f;animation:slidein .16s cubic-bezier(.2,.7,.3,1)}
.mini,.chip,.icon-btn,.action,button.metric{transition:border-color .12s ease,color .12s ease,background .12s ease}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.drawer-head h3{font-size:16px}.drawer-head p{margin-top:5px;color:var(--muted);font-size:12px}
.drawer-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.field{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.field span{color:var(--muted)}.field a{color:var(--accent)}
.sub{font:700 10px var(--mono);color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.contact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;font-size:13px}
.warn-box{padding:11px 13px;border:1px solid #e8a8b2;border-radius:4px;background:#fff1f3;color:var(--danger);font-size:12.5px;line-height:1.6}
.drawer-actions{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.chart-wrap{padding:16px}.chart-wrap svg{width:100%;height:230px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* 名單改成卡片：欄位常常是空的，排成六欄表格會整頁都是「-」，
   而姓名欄撐到 300px 只為了裝三個字。 */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px;align-items:start}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;transition:border-color .12s,box-shadow .12s;cursor:pointer}
.pcard:hover{border-color:var(--accent);box-shadow:0 2px 10px #17201c14}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard-name{font-size:14px;font-weight:700}
.pcard-facts{margin-top:9px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.pcard-facts div{display:flex;gap:7px}
.pcard-facts .k{width:14px;flex-shrink:0;text-align:center;opacity:.7}
.pcard-facts a{color:var(--accent);text-decoration:none}
.pcard-facts a:hover{text-decoration:underline}
.pcard .row-actions{margin-top:10px;justify-content:flex-start}
.pcard-when{font:11px var(--mono);color:var(--muted);margin-top:5px}
.viewseg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.viewseg button{border:0;background:var(--surface);color:var(--muted);padding:0 13px;height:31px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;flex-shrink:0}
.viewseg button+button{border-left:1px solid var(--line)}
.viewseg button:hover{background:var(--soft);color:var(--accent)}
.viewseg button.on{background:var(--accent);color:#fff}
#elder-map{height:min(62vh,560px);width:100%}
.map-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;color:var(--muted)}
.map-foot i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.pin{border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px #0006}
.pin.sel{outline:3px solid #f8b52c}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 15px;border:1px solid var(--line);border-radius:5px;background:var(--surface);box-shadow:0 4px 16px #17201c1f;font-size:13px;max-width:320px}
.toast.bad{border-color:#e8a8b2;color:var(--danger)}
@media(max-width:1120px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
/* 窄螢幕不要把欄位壓到一個字一行：給表格最小寬度，讓它在容器內橫向捲動。 */
@media(max-width:760px){
  .table-wrap table{min-width:440px}
  .table-wrap td,.table-wrap th{white-space:nowrap}
  .alert-row{grid-template-columns:10px 1fr auto;row-gap:8px}
  .alert-row .row-actions{grid-column:1/-1;justify-content:flex-start}
  .page-heading{flex-wrap:wrap;gap:10px}
  .page-heading > div:last-child{flex:1 1 100%;flex-wrap:wrap}
  .page-heading input{flex:1 1 140px;min-width:0}
  .panel-head{height:auto;padding:10px 12px;flex-wrap:wrap;gap:8px}
  .panel-head input{width:100%}
  .drawer{width:100%}
}
@media(max-width:760px){.sidebar{width:58px;flex-basis:58px}.brand{padding:16px 0;text-align:center}.brand strong{font-size:0}.brand strong::after{content:"鄰";font-size:20px}.brand span,.nav-label,.nav-item span,.sidebar-bottom span{display:none}.nav-item{justify-content:center;padding:0;border-left:0}.content{padding:14px}.topbar{padding:0 14px}.metrics{grid-template-columns:repeat(2,1fr)}.stamp{display:none}.panel-head input{width:140px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><strong>鄰里守望</strong><span>照護現況</span></div>
  <div class="nav-label">現況</div>
  <button class="nav-item active" data-page="overview"><i data-lucide="layout-dashboard"></i><span>總覽</span></button>
  <button class="nav-item" data-page="elderly"><i data-lucide="heart-pulse"></i><span>長者狀態</span></button>
  <button class="nav-item" data-page="analytics-page"><i data-lucide="chart-line"></i><span>趨勢分析</span></button>
  <div class="nav-label">知識</div>
  <button class="nav-item" data-page="ai-page"><i data-lucide="messages-square"></i><span>AI 助手</span></button>
  <div class="nav-label">處置</div>
  <a class="nav-item nav-link" href="/workspace"><i data-lucide="network"></i><span>事件處置工作區</span></a>
  <div class="sidebar-bottom"><button id="mode" class="mode"><span id="mode-text">日常模式</span></button></div>
</aside>
<main class="main">
  <header class="topbar">
    <h1 id="title">總覽</h1>
    <div class="top-actions"><span class="stamp" id="stamp"></span><button class="icon-btn" id="refresh" title="重新整理"><i data-lucide="refresh-cw"></i><span>重新整理</span></button><a class="action" href="/workspace"><i data-lucide="arrow-up-right"></i><span>事件處置</span></a></div>
  </header>
  <div class="content">
    <section class="page active" id="page-overview">
      <div class="metrics">
        <button type="button" class="metric ok" data-filter="ok"><span>今日平安</span><strong id="m-ok">-</strong><small>點擊篩選名單</small></button>
        <button type="button" class="metric danger" data-filter="risk"><span>需要關注</span><strong id="m-risk">-</strong><small>未回應或求助</small></button>
        <button type="button" class="metric warning" data-filter="pending"><span>等待回覆</span><strong id="m-pending">-</strong><small>今日待確認</small></button>
        <div class="metric danger"><span>未解警報</span><strong id="m-alerts">-</strong><small>待聯繫處理</small></div>
        <div class="metric"><span>待處理需求</span><strong id="m-needs">-</strong><small>事件處置工作區</small></div>
        <div class="metric"><span>可用物資</span><strong id="m-resources">-</strong><small>正式登記資料</small></div>
      </div>
      <div class="grid">
        <article class="panel"><div class="panel-head"><h2>未解警報</h2><span class="badge b-muted" id="alert-count">0 筆</span></div><div class="alert-list" id="alerts"></div></article>
        <article class="panel"><div class="panel-head"><h2>今日打卡</h2><input id="overview-search" placeholder="搜尋姓名" aria-label="搜尋姓名"></div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>狀態</th><th>回覆時間</th><th></th></tr></thead><tbody id="overview-elderly"></tbody></table></div></article>
      </div>
    </section>
    <section class="page" id="page-elderly">
      <div class="page-heading"><div><h2>長者狀態</h2><p id="elderly-count">0 位</p></div>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="viewseg" id="elder-view"><button type="button" data-elderview="list" class="on">清單</button><button type="button" data-elderview="map">地圖</button></div>
          <input id="elderly-search" placeholder="搜尋姓名或地址" aria-label="搜尋姓名或地址">
        </div>
      </div>
      <div class="chips" id="elderly-chips"></div>
      <div id="elderly-list-panel" class="people-grid" aria-label="長者名單"></div>
      <article class="panel" id="elderly-map-panel" hidden>
        <div id="elder-map"></div>
        <div class="map-foot" id="elder-map-foot"></div>
      </article>
    </section>
    <section class="page" id="page-analytics-page">
      <div class="page-heading"><div><h2>近 14 日趨勢</h2><p>打卡、警報與需求紀錄</p></div><div class="chips" id="trend-range"></div></div>
      <article class="panel" style="margin-bottom:16px"><div class="chart-wrap" id="trend-chart"></div><div class="legend" id="trend-legend"></div></article>
      <article class="panel trend-table"><div class="panel-head"><h2>每日明細</h2></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>平安</th><th>未回應</th><th>求助</th><th>等待</th><th>警報</th><th>需求</th><th>完成</th></tr></thead><tbody id="trends-body"></tbody></table></div></article>
    </section>
    <section class="page" id="page-ai-page">
      <div class="page-heading"><div><h2>AI 知識查詢</h2><p>依已核准知識庫回覆</p></div></div>
      <article class="panel ask"><form class="query-row" id="rag-form"><input id="rag-question" required maxlength="500" placeholder="輸入急救、避難或照護問題"><button class="primary" id="rag-submit">查詢</button></form><div class="answer" id="rag-answer" hidden></div><div class="sources" id="rag-sources" hidden></div></article>
    </section>
  </div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="長者詳情">
  <div class="drawer-head">
    <div><h3 id="d-name">-</h3><p id="d-status">-</p></div>
    <button class="mini" id="d-close" aria-label="關閉">關閉</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-actions" id="d-actions"></div>
</aside>
<div class="modal" id="confirm-modal" hidden role="dialog" aria-modal="true" aria-labelledby="cm-title">
  <div class="modal-card">
    <h3 id="cm-title">確認</h3>
    <p id="cm-text"></p>
    <div class="modal-foot"><button class="mini" id="cm-cancel">取消</button><button class="danger-btn" id="cm-ok">確認</button></div>
  </div>
</div>
<div class="toast-stack" id="toasts"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const pageTitles={overview:'總覽',elderly:'長者狀態','analytics-page':'趨勢分析','ai-page':'AI 助手'};
const statuses={ok:['平安','b-ok'],safe:['平安','b-ok'],confirmed_safe:['已確認安全','b-ok'],no_response:['未回應','b-danger'],help_needed:['需要協助','b-danger'],pending:['等待中','b-warning'],not_sent:['未發送','b-muted']};
let elders=[];
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function badge(status){const [label,cls]=statuses[status]||[status||'未知','b-muted'];return `<span class="badge ${cls}">${esc(label)}</span>`;}
function clock(value){if(!value)return '-';const iso=String(value).replace(' ','T');const date=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso)?iso:iso+'Z');return Number.isNaN(+date)?'-':date.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Taipei'});}
function toast(text,bad=false){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=text;$('toasts').appendChild(el);setTimeout(()=>el.remove(),bad?6000:3500);}
// 自己的確認框，取代原生 confirm()：原生的樣式跟整個介面搭不起來，也沒辦法把
// 「這個動作實際會影響誰」講清楚。
function askConfirm(title,text,okLabel='確認'){
  return new Promise(resolve=>{
    const modal=$('confirm-modal'),ok=$('cm-ok'),cancel=$('cm-cancel'),last=document.activeElement;
    $('cm-title').textContent=title;$('cm-text').textContent=text;ok.textContent=okLabel;
    modal.hidden=false;ok.focus();
    const done=result=>{modal.hidden=true;ok.onclick=cancel.onclick=null;document.removeEventListener('keydown',key);if(last&&last.focus)last.focus();resolve(result);};
    const key=event=>{if(event.key==='Escape')done(false);};
    ok.onclick=()=>done(true);cancel.onclick=()=>done(false);
    modal.onclick=event=>{if(event.target===modal)done(false);};
    document.addEventListener('keydown',key);
  });
}
function skeletonRows(count,cols){return Array.from({length:count},()=>`<tr>${Array.from({length:cols},()=>'<td><span class="skel"></span></td>').join('')}</tr>`).join('');}
// 狀態分組：畫面上的篩選是「平安／需要關注／等待／未發送」四組，底層可能對應多個原始狀態值。
const GROUPS={ok:['ok','safe','confirmed_safe'],risk:['no_response','help_needed'],pending:['pending'],not_sent:['not_sent']};
const GROUP_LABEL={ok:'平安',risk:'需要關注',pending:'等待回覆',not_sent:'未發送'};
function inGroup(row,group){return !group||(GROUPS[group]||[]).includes(row.today_status||'not_sent');}
let overviewFilter='',elderFilter='',relationsCache=null;
function elderById(id){return elders.find(e=>String(e.id)===String(id));}
function showPage(id){if(!pageTitles[id])id='overview';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+id));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===id));$('title').textContent=pageTitles[id];if(id==='analytics-page')loadTrends();if(history.replaceState)history.replaceState(null,'','#'+id);}
// 只剩總覽的「今日打卡」用這張表：姓名／狀態／回覆時間，長者名單那頁走卡片。
function renderElders(target,data){
  $(target).innerHTML=data.length?data.map(row=>`<tr data-row="${esc(row.id)}" tabindex="0"><td><strong>${esc(row.name)}</strong></td><td>${badge(row.today_status)}</td><td class="muted">${clock(row.responded_at)}</td><td><div class="row-actions">${row.phone?`<a class="mini" href="tel:${esc(row.phone)}" title="撥號給 ${esc(row.name)}">撥號</a>`:''}<button class="mini" data-detail="${esc(row.id)}">詳情</button></div></td></tr>`).join(''):`<tr><td colspan="4" class="empty">這個條件下沒有長者<br><span class="muted" style="font-size:12px">換個狀態或清掉搜尋字看看</span></td></tr>`;
  // 整列可點（含鍵盤 Enter），不用瞄準那顆小按鈕；列內的連結／按鈕自己處理，不重複觸發。
  $(target).querySelectorAll('tr[data-row]').forEach(tr=>{
    const open=()=>openDrawer(tr.dataset.row);
    tr.onclick=event=>{if(!event.target.closest('a,button'))open();};
    tr.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();open();}};
  });
  $(target).querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.detail));
}
function renderElderChips(){
  const counts=g=>elders.filter(r=>inGroup(r,g)).length;
  const items=[['','全部',elders.length],...Object.keys(GROUPS).map(g=>[g,GROUP_LABEL[g],counts(g)])];
  $('elderly-chips').innerHTML=items.map(([g,label,n])=>`<button type="button" class="chip ${elderFilter===g?'on':''}" data-chip="${g}">${esc(label)}<b>${n}</b></button>`).join('');
  $('elderly-chips').querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{elderFilter=b.dataset.chip;renderElderChips();applyElderFilters();});
}
function applyElderFilters(){
  const q=$('elderly-search').value;
  const rows=elders.filter(r=>inGroup(r,elderFilter)&&(r.name.includes(q)||(r.address||'').includes(q)));
  renderElderCards(rows);
  if(elderView==='map')renderElderMap(rows);
}
// 沒有值的欄位直接不畫，不要留一個「-」佔著位子。
function renderElderCards(rows){
  const host=$('elderly-list-panel');
  if(!rows.length){host.innerHTML=`<p class="empty" style="grid-column:1/-1">${elders.length?'這個條件下沒有長者，換個狀態或清掉搜尋字':'尚未登記長者'}</p>`;return;}
  host.innerHTML=rows.map(r=>{
    const facts=[
      r.phone?`<div><span class="k">☎</span><a href="tel:${esc(r.phone)}" onclick="event.stopPropagation()">${esc(r.phone)}</a></div>`:'',
      r.address?`<div><span class="k">◎</span><span>${esc(r.address)}</span></div>`:'',
    ].join('');
    return `<article class="pcard" data-card="${esc(r.id)}" tabindex="0">
      <div class="pcard-top"><span class="pcard-name">${esc(r.name)}</span>${badge(r.today_status)}</div>
      ${facts?`<div class="pcard-facts">${facts}</div>`:''}
      ${r.responded_at?`<div class="pcard-when">回覆 ${clock(r.responded_at)}</div>`:''}
    </article>`;
  }).join('');
  host.querySelectorAll('[data-card]').forEach(card=>{
    const open=()=>openDrawer(card.dataset.card);
    card.onclick=event=>{if(!event.target.closest('a'))open();};
    card.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();open();}};
  });
}
// 狀態顏色：地圖上唯一的資訊就是位置＋顏色，所以跟清單的徽章用同一套語意。
const PIN={ok:'#18765a',safe:'#18765a',confirmed_safe:'#18765a',no_response:'#c9364b',help_needed:'#c9364b',pending:'#9a6500',not_sent:'#9ca9a0'};
let elderView='list',elderMap=null,elderPins=null;
function setElderView(view){
  elderView=view;
  $('elderly-list-panel').hidden=view!=='list';
  $('elderly-map-panel').hidden=view!=='map';
  document.querySelectorAll('#elder-view [data-elderview]').forEach(b=>b.classList.toggle('on',b.dataset.elderview===view));
  if(view==='map')applyElderFilters();
}
function renderElderMap(rows){
  if(!window.L){$('elder-map').innerHTML='<p class="empty">地圖元件載入失敗（可能被網路或擴充功能擋住），請改用清單檢視。</p>';return;}
  if(!elderMap){
    elderMap=L.map('elder-map',{preferCanvas:true}).setView([23.7,121],8);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(elderMap);
    elderPins=L.layerGroup().addTo(elderMap);
  }
  elderMap.invalidateSize();
  elderPins.clearLayers();
  const located=rows.filter(r=>r.lat!==null&&r.lng!==null);
  located.forEach(r=>{
    const size=(r.today_status==='help_needed'||r.today_status==='no_response')?24:18;
    const marker=L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:`<div class="pin" style="width:${size}px;height:${size}px;background:${PIN[r.today_status]||'#9ca9a0'}"></div>`})});
    // 用 createTextNode 而不是樣板字串塞 HTML：名字是使用者可控的內容。
    marker.bindTooltip(document.createTextNode(r.name + ' · ' + (statuses[r.today_status]||['未知'])[0]));
    marker.on('click',()=>openDrawer(r.id));
    elderPins.addLayer(marker);
  });
  if(located.length)elderMap.fitBounds(located.map(r=>[r.lat,r.lng]),{padding:[45,45],maxZoom:16});
  const missing=rows.length-located.length;
  $('elder-map-foot').innerHTML=Object.entries({ok:'平安',no_response:'未回應',help_needed:'需要協助',pending:'等待中',not_sent:'未發送'})
    .map(([k,label])=>`<span><i style="background:${PIN[k]}"></i>${label}</span>`).join('')
    +(missing?`<span style="margin-left:auto">${missing} 位沒有座標，不會出現在地圖上</span>`:'');
}
function applyOverviewFilter(){
  const q=$('overview-search').value;
  renderElders('overview-elderly',elders.filter(r=>inGroup(r,overviewFilter)&&r.name.includes(q)));
  document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('on',el.dataset.filter===overviewFilter));
}
function renderAlerts(rows){
  $('alert-count').textContent=rows.length+' 筆';
  const labels={help_needed:'主動求助',no_response_1h:'超過 1 小時未回應',no_response_3h:'超過 3 小時未回應'};
  $('alerts').innerHTML=rows.length?rows.map(row=>{
    const high=row.alert_type==='help_needed'||row.alert_type==='no_response_3h';
    return `<div class="alert-row"${row.elderly_id?` data-row="${esc(row.elderly_id)}" tabindex="0"`:''}><span class="dot ${high?'high':''}"></span><div><strong>${esc(row.elderly)}</strong><p>${esc(labels[row.alert_type]||row.alert_type)}</p></div><time>${clock(row.created_at)}</time><div class="row-actions">${row.elderly_id?`<button class="mini warn" data-resolve="${esc(row.elderly_id)}" data-who="${esc(row.elderly)}">處理</button>`:''}</div></div>`;
  }).join(''):'<div class="empty">目前沒有未解警報<br><span class="muted" style="font-size:12px">長者未回應或主動求助時會出現在這裡</span></div>';
  $('alerts').querySelectorAll('[data-row]').forEach(el=>{
    const open=()=>openDrawer(el.dataset.row);
    el.style.cursor='pointer';
    el.onclick=event=>{if(!event.target.closest('button'))open();};
    el.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();open();}};
  });
  $('alerts').querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>resolveAlerts(b.dataset.resolve,b.dataset.who));
}
async function resolveAlerts(elderlyId,who){
  const yes=await askConfirm('標記警報已處理',`把「${who}」名下所有未解警報標記為已處理。這不會通知對方，只是從待辦清單移除。`,'標記已處理');
  if(!yes)return;
  try{
    const response=await fetch(`/api/dashboard/users/${encodeURIComponent(elderlyId)}/resolve_alerts`,{method:'POST'});
    const data=await response.json();
    if(!response.ok)throw Error(data.detail||'處理失敗');
    toast(data.message||'已處理');
    await loadAll();
    if(!$('drawer').hidden)openDrawer(elderlyId);
  }catch(error){toast(error.message,true);}
}
let drawerOpener=null;
function closeDrawer(){if($('drawer').hidden)return;$('drawer').hidden=true;$('scrim').hidden=true;if(drawerOpener&&drawerOpener.focus)drawerOpener.focus();drawerOpener=null;}
async function openDrawer(elderlyId){
  const row=elderById(elderlyId);
  if($('drawer').hidden)drawerOpener=document.activeElement;   // 關閉時把焦點還回原本那一列
  $('drawer').hidden=false;$('scrim').hidden=false;$('d-close').focus();
  $('d-name').textContent=row?row.name:'（查無此長者）';
  $('d-status').innerHTML=row?`${badge(row.today_status)} <span class="muted">回覆 ${clock(row.responded_at)}</span>`:'';
  $('d-actions').innerHTML=row?`${row.phone?`<a class="mini" href="tel:${esc(row.phone)}">撥號 ${esc(row.phone)}</a>`:''}<button class="mini warn" id="d-resolve">標記警報已處理</button>`:'';
  if(row)$('d-resolve').onclick=()=>resolveAlerts(row.id,row.name);
  if(!row){$('d-body').innerHTML='';return;}
  $('d-body').innerHTML=`<div><div class="field"><span>電話</span>${row.phone?`<a href="tel:${esc(row.phone)}">${esc(row.phone)}</a>`:'<b class="muted">未留</b>'}</div><div class="field"><span>地址</span><b>${esc(row.address||'未留')}</b></div><div class="field"><span>座標</span><b class="muted">${row.lat!=null?`${row.lat}, ${row.lng}`:'未定位'}</b></div></div><div id="d-contacts"><div class="sub">緊急聯絡人</div><p class="muted">讀取中…</p></div>`;
  try{
    if(!relationsCache)relationsCache=await fetch('/api/dashboard/relations').then(r=>r.json());
    const mine=relationsCache.filter(r=>String(r.elderly_id)===String(row.id)).sort((a,b)=>a.notify_order-b.notify_order);
    $('d-contacts').innerHTML=`<div class="sub">緊急聯絡人</div>`+(mine.length
      ? mine.map(r=>`<div class="contact"><div><strong>${esc(r.contact_name)}</strong> <span class="muted">${esc(r.relation)}</span></div><span class="badge b-muted">順位 ${r.notify_order}</span></div>`).join('')
      : `<div class="warn-box">這位長者沒有設定任何緊急聯絡人。未回應時系統找不到人通知，請到「照護關係」補上。</div>`);
  }catch(error){$('d-contacts').innerHTML=`<div class="sub">緊急聯絡人</div><p class="muted">讀取失敗</p>`;}
}
async function loadAll(){
  if(!elders.length){$('overview-elderly').innerHTML=skeletonRows(5,4);$('elderly-list-panel').innerHTML=Array.from({length:6},()=>'<article class="pcard"><span class="skel" style="width:60%"></span><span class="skel" style="margin-top:12px"></span></article>').join('');$('alerts').innerHTML='<div style="padding:14px 16px">'+Array.from({length:3},()=>'<span class="skel" style="margin-bottom:14px"></span>').join('')+'</div>';}
  try{const [summary,elderRows,alerts]=await Promise.all([fetch('/api/dashboard/summary').then(r=>r.json()),fetch('/api/dashboard/elderly').then(r=>r.json()),fetch('/api/dashboard/alerts').then(r=>r.json())]);const cs=summary.checkin_summary||{};$('m-ok').textContent=cs.ok||0;$('m-risk').textContent=(cs.no_response||0)+(cs.help_needed||0);$('m-pending').textContent=cs.pending||0;$('m-alerts').textContent=summary.active_alerts||0;$('m-needs').textContent=summary.open_needs||0;$('m-resources').textContent=summary.available_resources||0;elders=elderRows;relationsCache=null;$('elderly-count').textContent=elders.length+' 位';renderElderChips();applyOverviewFilter();applyElderFilters();renderAlerts(alerts);const emergency=summary.mode==='emergency';$('mode').classList.toggle('emergency',emergency);$('mode-text').textContent=emergency?'緊急模式':'日常模式';$('stamp').textContent='更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}catch(error){$('stamp').textContent='讀取失敗';}}
const SERIES=[{key:'checkin_ok',label:'平安',color:'#18765a'},{key:'checkin_no_response',label:'未回應',color:'#c9364b'},{key:'checkin_help_needed',label:'求助',color:'#d9822b'},{key:'alerts',label:'警報',color:'#8f52a8'},{key:'needs',label:'需求',color:'#2c7fad'}];
let trendDays=14;
// 手畫 SVG 折線圖，不引進圖表函式庫：外部 CDN 被擋掉時整張圖就沒了，這頁的重點就是那張圖。
function renderChart(rows){
  const w=960,h=230,padL=34,padR=12,padT=14,padB=26;
  const max=Math.max(1,...rows.flatMap(r=>SERIES.map(s=>r[s.key]||0)));
  const x=i=>padL+(rows.length<2?0:i*(w-padL-padR)/(rows.length-1));
  const y=v=>h-padB-(v/max)*(h-padT-padB);
  const ticks=[0,Math.ceil(max/2),max].filter((v,i,a)=>a.indexOf(v)===i);
  const grid=ticks.map(v=>`<line x1="${padL}" y1="${y(v)}" x2="${w-padR}" y2="${y(v)}" stroke="#d7dfda" stroke-width="1"/><text x="${padL-7}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#68756e">${v}</text>`).join('');
  const step=Math.ceil(rows.length/7);
  const xlabels=rows.map((r,i)=>i%step?'':`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#68756e">${esc(r.date.slice(5))}</text>`).join('');
  const lines=SERIES.map(s=>{
    const pts=rows.map((r,i)=>`${x(i)},${y(r[s.key]||0)}`).join(' ');
    const dots=rows.map((r,i)=>(r[s.key]||0)>0?`<circle cx="${x(i)}" cy="${y(r[s.key])}" r="3" fill="${s.color}"/>`:'').join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>${dots}`;
  }).join('');
  $('trend-chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="近 ${rows.length} 日趨勢折線圖">${grid}${xlabels}${lines}<line class="crosshair" id="cross" x1="0" y1="${padT}" x2="0" y2="${h-padB}" style="display:none"/></svg><div class="tip" id="tip" hidden></div>`;
  $('trend-legend').innerHTML=SERIES.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('');
  // 滑到圖上任何位置就顯示最靠近那一天的全部數列，不必去瞄準 3px 的小圓點。
  const wrap=$('trend-chart'),svg=wrap.querySelector('svg'),cross=wrap.querySelector('#cross'),tip=$('tip');
  const leave=()=>{cross.style.display='none';tip.hidden=true;};
  svg.addEventListener('mousemove',event=>{
    const box=svg.getBoundingClientRect();
    const vx=(event.clientX-box.left)/box.width*w;
    let i=Math.round((vx-padL)/((w-padL-padR)/Math.max(1,rows.length-1)));
    i=Math.max(0,Math.min(rows.length-1,i));
    const row=rows[i];
    cross.style.display='';cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));
    tip.hidden=false;
    tip.innerHTML=`<b>${esc(row.date)}</b>`+SERIES.map(s=>`<div><span><i style="background:${s.color}"></i>${esc(s.label)}</span><span>${row[s.key]||0}</span></div>`).join('');
    const px=x(i)/w*box.width;
    tip.style.left=Math.min(Math.max(px+14,8),box.width-tip.offsetWidth-8)+'px';
    tip.style.top='18px';
  });
  svg.addEventListener('mouseleave',leave);
}
function renderTrendRange(){
  $('trend-range').innerHTML=[7,14,30].map(n=>`<button type="button" class="chip ${trendDays===n?'on':''}" data-days="${n}">近 ${n} 日</button>`).join('');
  $('trend-range').querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{trendDays=+b.dataset.days;renderTrendRange();loadTrends();});
}
async function loadTrends(){const body=$('trends-body');body.innerHTML=skeletonRows(6,8);$('trend-chart').innerHTML='<span class="skel" style="height:200px;margin:8px 0"></span>';try{const data=await fetch('/api/dashboard/trends?days='+trendDays).then(r=>r.json());renderChart(data.days);body.innerHTML=data.days.slice().reverse().map(row=>`<tr><td>${esc(row.date)}</td><td>${row.checkin_ok}</td><td>${row.checkin_no_response}</td><td>${row.checkin_help_needed}</td><td>${row.checkin_pending}</td><td>${row.alerts}</td><td>${row.needs}</td><td>${row.needs_fulfilled}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">目前沒有資料</td></tr>';}catch(error){body.innerHTML='<tr><td colspan="8" class="empty">趨勢讀取失敗</td></tr>';$('trend-chart').innerHTML='<p class="empty">圖表讀取失敗</p>';}}
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));
$('overview-search').addEventListener('input',applyOverviewFilter);
$('elderly-search').addEventListener('input',applyElderFilters);
document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{overviewFilter=overviewFilter===el.dataset.filter?'':el.dataset.filter;applyOverviewFilter();}));
document.querySelectorAll('#elder-view [data-elderview]').forEach(b=>b.addEventListener('click',()=>setElderView(b.dataset.elderview)));
$('d-close').addEventListener('click',closeDrawer);
$('scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer();});
$('refresh').addEventListener('click',loadAll);
$('mode').addEventListener('click',async()=>{const next=$('mode').classList.contains('emergency')?'normal':'emergency';if(!confirm(next==='emergency'?'確定切換為緊急模式並通知 LINE 使用者？':'確定解除緊急模式？'))return;await fetch('/api/dashboard/mode?mode='+next,{method:'POST'});loadAll();});
$('rag-form').addEventListener('submit',async event=>{event.preventDefault();const button=$('rag-submit'),answer=$('rag-answer'),sources=$('rag-sources');button.disabled=true;button.textContent='查詢中';answer.hidden=false;answer.textContent='';sources.hidden=true;try{const response=await fetch('/api/rag/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('rag-question').value.trim()})});const data=await response.json();if(!response.ok)throw Error(data.detail||data.error||'查詢失敗');answer.textContent=data.answer||'目前沒有可用回答';const refs=(data.sources||[]).map(item=>typeof item==='string'?item:(item.source||item.title||'')).filter(Boolean);sources.textContent=refs.length?'來源：'+refs.join(' · '):'未回傳來源';sources.hidden=false;}catch(error){answer.textContent=error.message;}finally{button.disabled=false;button.textContent='查詢';}});
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data&&event.data.navigate)showPage(event.data.navigate);});
window.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();renderTrendRange();showPage(location.hash.slice(1)||'overview');loadAll();});
</script>
</body>
</html>
