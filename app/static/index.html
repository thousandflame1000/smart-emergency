<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄰里守望</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #f6f8fb;
  --sidebar:  #111827;
  --card:     #ffffff;
  --border:   #e5e9f0;
  --primary:  #2563eb;
  --success:  #16a34a;
  --danger:   #dc2626;
  --warning:  #d97706;
  --muted:    #6b7280;
  --text:     #111827;
  --radius:   12px;
  --shadow:   0 1px 4px rgba(0,0,0,.08);
}
body { background: var(--bg); font-family: -apple-system, 'Segoe UI', sans-serif;
       color: var(--text); font-size: 14px; display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--sidebar);
  display: flex; flex-direction: column;
  padding: 0;
  overflow: hidden;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-logo h1 { font-size: 15px; font-weight: 700; color: #fff; }
.sidebar-logo span { font-size: 11px; color: #6b7280; margin-top: 2px; display: block; }
.nav-section { padding: 16px 12px 4px; font-size: 10px; font-weight: 600;
               color: #4b5563; letter-spacing: .08em; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; margin: 1px 8px;
  color: #9ca3af; cursor: pointer; transition: all .15s;
  font-size: 13.5px; font-weight: 500; user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #e5e7eb; }
.nav-item.active { background: var(--primary); color: #fff; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-bottom {
  margin-top: auto; padding: 12px 8px;
  border-top: 1px solid rgba(255,255,255,.08);
}
#mode-pill {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600;
  background: rgba(22,163,74,.15); color: #4ade80;
  border: 1px solid rgba(22,163,74,.25); cursor: pointer;
  transition: all .2s;
}
#mode-pill.emergency {
  background: rgba(220,38,38,.2); color: #f87171;
  border-color: rgba(220,38,38,.35);
  animation: pulse-pill 2s ease-in-out infinite;
}
@keyframes pulse-pill { 0%,100%{opacity:1} 50%{opacity:.65} }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  height: 52px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px;
  justify-content: space-between; flex-shrink: 0;
}
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-right .ts { font-size: 12px; color: var(--muted); }
.content { flex: 1; overflow-y: auto; padding: 20px 24px; }

/* ── Pages ── */
.page { display: none; }
.page.active { display: block; }

/* ── Metrics ── */
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.metric {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
}
.metric-label { font-size: 11px; font-weight: 600; color: var(--muted);
                text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.metric-value { font-size: 32px; font-weight: 800; line-height: 1; }
.metric-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.c-green { color: var(--success); }
.c-red   { color: var(--danger); }
.c-amber { color: var(--warning); }
.c-blue  { color: var(--primary); }

/* ── Grid layouts ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 5fr 4fr; gap: 16px; }

/* ── Cards ── */
.card { background: var(--card); border: 1px solid var(--border);
        border-radius: var(--radius); overflow: hidden; }
.card-header {
  padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 13px; font-weight: 700; color: var(--text); }
.card-body { padding: 0; }

/* ── Table ── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: .04em;
          padding: 10px 16px; border-bottom: 1px solid var(--border); text-align: left; }
.tbl td { padding: 11px 16px; border-bottom: 1px solid #f3f4f6;
          font-size: 13px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: #f9fafb; }

/* ── Status badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.badge-green  { background: #dcfce7; color: #15803d; }
.badge-red    { background: #fee2e2; color: #b91c1c; }
.badge-amber  { background: #fef3c7; color: #92400e; }
.badge-gray   { background: #f3f4f6; color: #6b7280; }
.badge-blue   { background: #dbeafe; color: #1d4ed8; }

/* ── Map ── */
#map { height: 360px; border-radius: 0 0 var(--radius) var(--radius); }

/* ── Alert list ── */
.alert-row {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid #f3f4f6; gap: 10px;
}
.alert-row:last-child { border-bottom: none; }
.alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.alert-dot.high { background: var(--danger); }
.alert-dot.mid  { background: var(--warning); }
.alert-name { font-weight: 600; font-size: 13px; }
.alert-type { font-size: 11px; color: var(--muted); margin-top: 1px; }
.alert-time { margin-left: auto; font-size: 11px; color: var(--muted); }

/* ── Resource rows ── */
.res-row {
  display: flex; align-items: center; padding: 11px 16px;
  border-bottom: 1px solid #f3f4f6; gap: 10px;
}
.res-row:last-child { border-bottom: none; }
.res-icon { font-size: 20px; flex-shrink: 0; }
.res-name { font-weight: 600; font-size: 13px; }
.res-qty  { font-size: 11px; color: var(--muted); }
.res-avail { margin-left: auto; }

/* ── RAG panel ── */
.rag-wrap { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.rag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rag-chip {
  padding: 4px 10px; border-radius: 20px; font-size: 12px;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; transition: all .12s; color: var(--text);
}
.rag-chip:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
.rag-input-row { display: flex; gap: 8px; }
.rag-input {
  flex: 1; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; outline: none;
  transition: border-color .15s;
}
.rag-input:focus { border-color: var(--primary); }
.btn-primary {
  background: var(--primary); color: #fff; border: none;
  border-radius: 8px; padding: 8px 16px; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.rag-answer {
  background: #f8faff; border: 1px solid #dbeafe; border-radius: 8px;
  padding: 14px; white-space: pre-wrap; line-height: 1.75;
  font-size: 13px; max-height: 300px; overflow-y: auto;
}
.rag-src { font-size: 11px; color: var(--muted); margin-top: 6px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

/* ── Empty state ── */
.empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 13px; }
.empty-icon { font-size: 28px; margin-bottom: 8px; }

/* ── Input ── */
.search-input {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; font-size: 12px; outline: none;
  transition: border-color .15s; width: 160px;
}
.search-input:focus { border-color: var(--primary); }

/* ── Topbar btn ── */
.topbar-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 5px 12px; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all .15s;
}
.topbar-btn:hover { border-color: var(--primary); color: var(--primary); }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>🏘️ 鄰里守望</h1>
    <span>社區照護平台</span>
  </div>

  <div class="nav-section">主要功能</div>
  <div class="nav-item active" onclick="showPage('overview')">
    <span class="icon">📊</span> 總覽
  </div>
  <div class="nav-item" onclick="showPage('elderly')">
    <span class="icon">👴</span> 長者狀態
  </div>
  <div class="nav-item" onclick="showPage('map-page')">
    <span class="icon">🗺️</span> 社區地圖
  </div>
  <div class="nav-item" onclick="showPage('resources-page')">
    <span class="icon">📦</span> 物資
  </div>

  <div class="nav-section">工具</div>
  <div class="nav-item" onclick="showPage('ai-page')">
    <span class="icon">🤖</span> AI 助手
  </div>
  <div class="nav-item" onclick="window.location='/admin'">
    <span class="icon">⚙️</span> 管理後台
  </div>

  <div class="sidebar-bottom">
    <div id="mode-pill" onclick="toggleMode()">
      <span id="mode-dot">🟢</span>
      <span id="mode-text">日常模式</span>
    </div>
  </div>
</aside>

<!-- ── Main ── -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">總覽</div>
    <div class="topbar-right">
      <span class="ts" id="last-ts"></span>
      <button class="topbar-btn" onclick="loadAll()">↻ 刷新</button>
    </div>
  </div>

  <div class="content">

    <!-- ── Page: 總覽 ── -->
    <div class="page active" id="page-overview">

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">已回應</div>
          <div class="metric-value c-green" id="m-ok">—</div>
          <div class="metric-sub">今日打卡</div>
        </div>
        <div class="metric">
          <div class="metric-label">未回應</div>
          <div class="metric-value c-red" id="m-no">—</div>
          <div class="metric-sub">需要關注</div>
        </div>
        <div class="metric">
          <div class="metric-label">等待中</div>
          <div class="metric-value c-amber" id="m-pending">—</div>
          <div class="metric-sub">尚未回覆</div>
        </div>
        <div class="metric">
          <div class="metric-label">未解警報</div>
          <div class="metric-value c-red" id="m-alerts">—</div>
          <div class="metric-sub">需要處理</div>
        </div>
      </div>

      <div class="grid-3">
        <!-- 警報 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔔 警報</span>
          </div>
          <div class="card-body" id="alerts-list">
            <div class="empty"><div class="empty-icon">✅</div>目前無未解警報</div>
          </div>
        </div>

        <!-- 長者快覽 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">👴 今日打卡</span>
            <input class="search-input" id="search-input" placeholder="搜尋姓名…"
                   oninput="filterElderly(this.value)">
          </div>
          <div class="card-body">
            <table class="tbl">
              <thead>
                <tr><th>姓名</th><th>狀態</th><th>時間</th></tr>
              </thead>
              <tbody id="elderly-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Page: 長者狀態 ── -->
    <div class="page" id="page-elderly">
      <div class="card">
        <div class="card-header">
          <span class="card-title">👴 所有長者今日狀態</span>
          <input class="search-input" id="search-input2" placeholder="搜尋…"
                 oninput="filterElderly2(this.value)">
        </div>
        <div class="card-body">
          <table class="tbl">
            <thead><tr><th>姓名</th><th>電話</th><th>地址</th><th>狀態</th><th>回覆時間</th></tr></thead>
            <tbody id="elderly-tbody2"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Page: 地圖 ── -->
    <div class="page" id="page-map-page">
      <div class="card">
        <div class="card-header">
          <span class="card-title">🗺️ 社區地圖</span>
          <div style="display:flex;gap:12px;font-size:12px;color:var(--muted)">
            <span>🟢 已回應</span><span>🔴 未回應</span>
            <span>🟠 等待中</span><span>📍 物資點</span>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- ── Page: 物資 ── -->
    <div class="page" id="page-resources-page">
      <div class="card">
        <div class="card-header">
          <span class="card-title">📦 社區物資</span>
          <span style="font-size:12px;color:var(--muted)" id="res-count"></span>
        </div>
        <div class="card-body" id="resources-list"></div>
      </div>
    </div>

    <!-- ── Page: AI 助手 ── -->
    <div class="page" id="page-ai-page">
      <div class="card">
        <div class="card-header">
          <span class="card-title">🤖 AI 急救 · 長照助手</span>
          <span style="font-size:11px;color:var(--muted)">基於 SOP 知識庫，Gemini 生成</span>
        </div>
        <div class="rag-wrap">
          <div class="rag-chips">
            <span class="rag-chip" onclick="ask('心肺復甦術 CPR 步驟')">CPR 步驟</span>
            <span class="rag-chip" onclick="ask('老人失溫怎麼辦')">老人失溫</span>
            <span class="rag-chip" onclick="ask('中風怎麼辨識')">辨識中風</span>
            <span class="rag-chip" onclick="ask('異物哽塞哈姆立克法')">哈姆立克</span>
            <span class="rag-chip" onclick="ask('地震來了怎麼辦')">地震應變</span>
            <span class="rag-chip" onclick="ask('颱風前要準備什麼')">颱風準備</span>
            <span class="rag-chip" onclick="ask('低血糖緊急處理')">低血糖急救</span>
            <span class="rag-chip" onclick="ask('志工家訪流程')">志工訪視</span>
          </div>
          <div class="rag-input-row">
            <input class="rag-input" id="rag-q" placeholder="輸入問題，例如：老人跌倒無法起身怎麼辦？"
                   onkeydown="if(event.key==='Enter') ragQuery()">
            <button class="btn-primary" id="rag-btn" onclick="ragQuery()">送出</button>
          </div>
          <div id="rag-result" style="display:none">
            <div class="rag-answer" id="rag-answer"></div>
            <div class="rag-src" id="rag-src"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<script>
// ── State ──────────────────────────────────
let map, allElderly = [], currentPage = 'overview';

const STATUS = {
  ok:             ['已回應',   'badge-green'],
  no_response:    ['未回應',   'badge-red'],
  pending:        ['等待中',   'badge-amber'],
  help_needed:    ['需要幫忙', 'badge-red'],
  confirmed_safe: ['確認安全', 'badge-green'],
  not_sent:       ['未發送',   'badge-gray'],
};
const RES_ICON = { water:'💧',food:'🍱',first_aid:'🩹',shelter:'🏠',vehicle:'🚗',tool:'🔧',other:'📦' };
const PAGE_TITLES = {
  overview: '總覽', elderly: '長者狀態',
  'map-page': '社區地圖', 'resources-page': '物資',
  'ai-page': 'AI 助手',
};

// ── Navigation ─────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    if (n.getAttribute('onclick')?.includes(id)) n.classList.add('active');
  });
  document.getElementById('page-title').textContent = PAGE_TITLES[id] || id;
  currentPage = id;
  if (id === 'map-page' && map) setTimeout(() => map.invalidateSize(), 100);
}

// ── Map ────────────────────────────────────
function initMap() {
  map = L.map('map').setView([24.125, 120.678], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '© OpenStreetMap' }).addTo(map);
}

function updateMap(elderly, resources) {
  map.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.CircleMarker) map.removeLayer(l); });
  const C = { ok:'#16a34a', no_response:'#dc2626', pending:'#d97706', help_needed:'#b91c1c' };
  elderly.forEach(e => {
    if (!e.lat || !e.lng) return;
    const [label] = STATUS[e.today_status] || ['—'];
    L.circleMarker([e.lat, e.lng], {
      radius:10, color:'#fff', fillColor: C[e.today_status]||'#9ca3af', fillOpacity:.9, weight:2.5
    }).bindPopup(`<b>${e.name}</b><br>${label}<br><small>${e.address||''}</small>`).addTo(map);
  });
  resources.forEach(r => {
    if (!r.lat || !r.lng) return;
    L.marker([r.lat, r.lng]).bindPopup(
      `<b>${RES_ICON[r.resource_type]||'📦'} ${r.name}</b><br>數量：${r.quantity||'—'}`
    ).addTo(map);
  });
}

// ── Render helpers ─────────────────────────
function renderStatus(s) {
  const [label, cls] = STATUS[s] || ['—', 'badge-gray'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderElderly(data, tbodyId) {
  const tbody = document.getElementById(tbodyId);
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">暫無資料</td></tr>`; return;
  }
  tbody.innerHTML = data.map(e => {
    const time = e.responded_at ? e.responded_at.slice(11,16) : '—';
    return `<tr>
      <td style="font-weight:600">${e.name}</td>
      ${tbodyId === 'elderly-tbody2' ? `<td style="color:var(--muted)">${e.phone||'—'}</td><td style="color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.address||'—'}</td>` : ''}
      <td>${renderStatus(e.today_status)}</td>
      <td style="color:var(--muted)">${time}</td>
    </tr>`;
  }).join('');
}

function filterElderly(q) {
  renderElderly(allElderly.filter(e => e.name.includes(q)||''.includes(q)), 'elderly-tbody');
}
function filterElderly2(q) {
  renderElderly(allElderly.filter(e => e.name.includes(q)||(e.address||'').includes(q)), 'elderly-tbody2');
}

function renderAlerts(data) {
  const el = document.getElementById('alerts-list');
  if (!data.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✅</div>目前無未解警報</div>`; return;
  }
  el.innerHTML = data.map(a => {
    const cls = a.alert_type.includes('3h') || a.alert_type === 'help_needed' ? 'high' : 'mid';
    const typeLabel = { no_response_1h:'超過 1 小時未回應', no_response_3h:'超過 3 小時未回應', help_needed:'主動求助' };
    return `<div class="alert-row">
      <div class="alert-dot ${cls}"></div>
      <div>
        <div class="alert-name">${a.elderly}</div>
        <div class="alert-type">${typeLabel[a.alert_type]||a.alert_type}</div>
      </div>
      <div class="alert-time">${(a.created_at||'').slice(11,16)}</div>
    </div>`;
  }).join('');
}

function renderResources(data) {
  const el = document.getElementById('resources-list');
  document.getElementById('res-count').textContent = `${data.length} 筆`;
  if (!data.length) { el.innerHTML = `<div class="empty">暫無物資資料</div>`; return; }
  el.innerHTML = data.map(r => `
    <div class="res-row">
      <span class="res-icon">${RES_ICON[r.resource_type]||'📦'}</span>
      <div>
        <div class="res-name">${r.name}</div>
        <div class="res-qty">${r.quantity||''} · ${r.address||''}</div>
      </div>
      <div class="res-avail">
        <span class="badge ${r.is_available?'badge-green':'badge-gray'}">
          ${r.is_available?'可用':'不可用'}
        </span>
      </div>
    </div>`).join('');
}

// ── Load ───────────────────────────────────
async function loadAll() {
  try {
    const [summary, elderly, resources, alerts] = await Promise.all([
      fetch('/api/dashboard/summary').then(r=>r.json()),
      fetch('/api/dashboard/elderly').then(r=>r.json()),
      fetch('/api/resources/').then(r=>r.json()),
      fetch('/api/dashboard/alerts').then(r=>r.json()),
    ]);

    const cs = summary.checkin_summary || {};
    document.getElementById('m-ok').textContent      = cs.ok || 0;
    document.getElementById('m-no').textContent      = (cs.no_response || 0) + (cs.help_needed || 0);
    document.getElementById('m-pending').textContent = cs.pending || 0;
    document.getElementById('m-alerts').textContent  = summary.active_alerts || 0;

    // Mode
    const pill = document.getElementById('mode-pill');
    if (summary.mode === 'emergency') {
      pill.classList.add('emergency');
      document.getElementById('mode-dot').textContent = '🚨';
      document.getElementById('mode-text').textContent = '緊急模式';
    } else {
      pill.classList.remove('emergency');
      document.getElementById('mode-dot').textContent = '🟢';
      document.getElementById('mode-text').textContent = '日常模式';
    }

    document.getElementById('last-ts').textContent = '更新 ' + new Date().toLocaleTimeString('zh-TW');
    allElderly = elderly;

    renderElderly(elderly, 'elderly-tbody');
    renderElderly(elderly, 'elderly-tbody2');
    renderAlerts(alerts);
    renderResources(resources);
    updateMap(elderly, resources);
  } catch(e) { console.error(e); }
}

// ── Mode toggle ────────────────────────────
async function toggleMode() {
  const isEmergency = document.getElementById('mode-pill').classList.contains('emergency');
  const next = isEmergency ? 'normal' : 'emergency';
  const label = next === 'emergency' ? '緊急' : '日常';
  if (!confirm(`確定切換為${label}模式？${next==='emergency'?'\n\n⚠️ 系統將廣播通知所有 LINE 用戶':''}`)) return;
  await fetch(`/api/dashboard/mode?mode=${next}`, { method:'POST' });
  loadAll();
}

// ── RAG ────────────────────────────────────
function ask(q) {
  document.getElementById('rag-q').value = q;
  showPage('ai-page');
  ragQuery();
}

async function ragQuery() {
  const q = document.getElementById('rag-q').value.trim();
  if (!q) return;
  const btn = document.getElementById('rag-btn');
  btn.disabled = true; btn.textContent = '查詢中…';
  document.getElementById('rag-result').style.display = 'none';
  try {
    const res = await fetch('/api/rag/query', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: q }),
    });
    const d = await res.json();
    document.getElementById('rag-answer').textContent = d.answer || '（無回答）';
    document.getElementById('rag-src').textContent =
      d.sources?.length ? '📚 來源：' + d.sources.join(' · ') : '';
    document.getElementById('rag-result').style.display = 'block';
  } catch(e) {
    document.getElementById('rag-answer').textContent = '查詢失敗：' + e.message;
    document.getElementById('rag-result').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '送出';
  }
}

// ── Init ───────────────────────────────────
initMap();
loadAll();
setInterval(loadAll, 30000);
</script>
