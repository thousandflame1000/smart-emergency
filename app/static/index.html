<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄰里守望 · 照護現況</title>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
:root{--bg:#f3f6f3;--surface:#fff;--ink:#17201c;--muted:#68756e;--line:#d7dfda;--nav:#181d1b;--nav-muted:#9aa69f;--accent:#13795b;--danger:#c9364b;--warning:#9a6500;--ok:#18765a;--soft:#e8f2ed;--radius:6px;--sans:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
html{color-scheme:light}.embed .sidebar { display: none !important; }.embed .main{width:100%}
body{height:100vh;overflow:hidden;display:flex;background:var(--bg);color:var(--ink);font:14px var(--sans)}
button,input{font:inherit}.sidebar{width:220px;flex:0 0 220px;background:var(--nav);color:#eef4f0;display:flex;flex-direction:column;border-right:1px solid #303a35}
.brand{padding:20px;border-bottom:1px solid #303a35}.brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:4px;color:var(--nav-muted);font-size:11px}
.nav-label{padding:18px 16px 6px;color:#77847d;font:700 10px var(--mono);text-transform:uppercase}
.nav-item{width:100%;height:40px;padding:0 16px;border:0;border-left:3px solid transparent;background:none;color:var(--nav-muted);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.nav-item:hover{background:#202823;color:#fff}.nav-item.active{border-left-color:#77d6b5;background:#23322b;color:#9ae4c8}.nav-item svg{width:17px;height:17px}
.nav-link{text-decoration:none}.sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid #303a35}
.mode{width:100%;height:38px;border:1px solid #476457;border-radius:4px;background:#22342b;color:#9ae4c8;cursor:pointer}.mode.emergency{border-color:#8f3947;background:#3c2328;color:#ff9caa}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar h1{font-size:16px}.top-actions{display:flex;align-items:center;gap:10px}.stamp{color:var(--muted);font:12px var(--mono)}
.icon-btn,.action{height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px;padding:0 11px;cursor:pointer;text-decoration:none}.icon-btn:hover,.action:hover{border-color:var(--accent);color:var(--accent)}.icon-btn svg,.action svg{width:16px;height:16px}
.content{padding:22px 24px 32px;overflow:auto}.page{display:none}.page.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.metric{background:var(--surface);padding:15px 16px;min-height:95px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:8px;font:700 27px var(--mono)}.metric small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.metric.danger strong{color:var(--danger)}.metric.warning strong{color:var(--warning)}.metric.ok strong{color:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,1.3fr);gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.panel-head{height:48px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:13px}.panel-head input{width:190px;height:31px;border:1px solid var(--line);border-radius:4px;padding:0 9px;color:var(--ink)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{padding:10px 14px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;background:#f8faf8;white-space:nowrap}td{padding:11px 14px;border-top:1px solid var(--line);font-size:13px}tbody tr:hover{background:#f8faf8}.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border:1px solid;border-radius:3px;font-size:11px;font-weight:700}.b-ok{color:var(--ok);border-color:#9bcbbb;background:#edf8f4}.b-danger{color:var(--danger);border-color:#e8a8b2;background:#fff1f3}.b-warning{color:var(--warning);border-color:#e4c17a;background:#fff8e8}.b-muted{color:var(--muted);border-color:var(--line);background:#f4f6f4}
.alert-list{max-height:520px;overflow:auto}.alert-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.alert-row:first-child{border-top:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--warning)}.dot.high{background:var(--danger)}.alert-row strong{font-size:13px}.alert-row p{margin-top:3px;color:var(--muted);font-size:11px}.alert-row time{color:var(--muted);font:11px var(--mono)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}.page-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.page-heading h2{font-size:17px}.page-heading p{margin-top:4px;color:var(--muted);font-size:12px}
.trend-table td:not(:first-child),.trend-table th:not(:first-child){text-align:right;font-family:var(--mono)}
.ask{max-width:900px}.query-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px}.query-row input{height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px}.primary{height:40px;border:0;border-radius:4px;background:var(--accent);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.answer{padding:16px;border-top:1px solid var(--line);line-height:1.75;white-space:pre-wrap}.sources{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:1120px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:58px;flex-basis:58px}.brand{padding:16px 0;text-align:center}.brand strong{font-size:0}.brand strong::after{content:"鄰";font-size:20px}.brand span,.nav-label,.nav-item span,.sidebar-bottom span{display:none}.nav-item{justify-content:center;padding:0;border-left:0}.content{padding:14px}.topbar{padding:0 14px}.metrics{grid-template-columns:repeat(2,1fr)}.stamp{display:none}.panel-head input{width:140px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><strong>鄰里守望</strong><span>照護現況</span></div>
  <div class="nav-label">現況</div>
  <button class="nav-item active" data-page="overview"><i data-lucide="layout-dashboard"></i><span>總覽</span></button>
  <button class="nav-item" data-page="elderly"><i data-lucide="heart-pulse"></i><span>長者狀態</span></button>
  <button class="nav-item" data-page="analytics-page"><i data-lucide="chart-line"></i><span>趨勢分析</span></button>
  <div class="nav-label">知識</div>
  <button class="nav-item" data-page="ai-page"><i data-lucide="messages-square"></i><span>AI 助手</span></button>
  <div class="nav-label">處置</div>
  <a class="nav-item nav-link" href="/workspace"><i data-lucide="network"></i><span>事件處置工作區</span></a>
  <div class="sidebar-bottom"><button id="mode" class="mode"><span id="mode-text">日常模式</span></button></div>
</aside>
<main class="main">
  <header class="topbar">
    <h1 id="title">總覽</h1>
    <div class="top-actions"><span class="stamp" id="stamp"></span><button class="icon-btn" id="refresh" title="重新整理"><i data-lucide="refresh-cw"></i><span>重新整理</span></button><a class="action" href="/workspace"><i data-lucide="arrow-up-right"></i><span>事件處置</span></a></div>
  </header>
  <div class="content">
    <section class="page active" id="page-overview">
      <div class="metrics">
        <div class="metric ok"><span>今日平安</span><strong id="m-ok">-</strong><small>已完成打卡</small></div>
        <div class="metric danger"><span>需要關注</span><strong id="m-risk">-</strong><small>未回應或求助</small></div>
        <div class="metric warning"><span>等待回覆</span><strong id="m-pending">-</strong><small>今日待確認</small></div>
        <div class="metric danger"><span>未解警報</span><strong id="m-alerts">-</strong><small>待聯繫處理</small></div>
        <div class="metric"><span>待處理需求</span><strong id="m-needs">-</strong><small>事件處置工作區</small></div>
        <div class="metric"><span>可用物資</span><strong id="m-resources">-</strong><small>正式登記資料</small></div>
      </div>
      <div class="grid">
        <article class="panel"><div class="panel-head"><h2>未解警報</h2><span class="badge b-muted" id="alert-count">0 筆</span></div><div class="alert-list" id="alerts"></div></article>
        <article class="panel"><div class="panel-head"><h2>今日打卡</h2><input id="overview-search" placeholder="搜尋姓名" aria-label="搜尋姓名"></div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>狀態</th><th>回覆時間</th></tr></thead><tbody id="overview-elderly"></tbody></table></div></article>
      </div>
    </section>
    <section class="page" id="page-elderly">
      <div class="page-heading"><div><h2>長者狀態</h2><p id="elderly-count">0 位</p></div><input id="elderly-search" placeholder="搜尋姓名或地址" aria-label="搜尋姓名或地址"></div>
      <article class="panel"><div class="table-wrap"><table><thead><tr><th>姓名</th><th>電話</th><th>地址</th><th>今日狀態</th><th>回覆時間</th></tr></thead><tbody id="elderly-body"></tbody></table></div></article>
    </section>
    <section class="page" id="page-analytics-page">
      <div class="page-heading"><div><h2>近 14 日趨勢</h2><p>打卡、警報與需求紀錄</p></div></div>
      <article class="panel trend-table"><div class="table-wrap"><table><thead><tr><th>日期</th><th>平安</th><th>未回應</th><th>求助</th><th>等待</th><th>警報</th><th>需求</th><th>完成</th></tr></thead><tbody id="trends-body"></tbody></table></div></article>
    </section>
    <section class="page" id="page-ai-page">
      <div class="page-heading"><div><h2>AI 知識查詢</h2><p>依已核准知識庫回覆</p></div></div>
      <article class="panel ask"><form class="query-row" id="rag-form"><input id="rag-question" required maxlength="500" placeholder="輸入急救、避難或照護問題"><button class="primary" id="rag-submit">查詢</button></form><div class="answer" id="rag-answer" hidden></div><div class="sources" id="rag-sources" hidden></div></article>
    </section>
  </div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const pageTitles={overview:'總覽',elderly:'長者狀態','analytics-page':'趨勢分析','ai-page':'AI 助手'};
const statuses={ok:['平安','b-ok'],safe:['平安','b-ok'],confirmed_safe:['已確認安全','b-ok'],no_response:['未回應','b-danger'],help_needed:['需要協助','b-danger'],pending:['等待中','b-warning'],not_sent:['未發送','b-muted']};
let elders=[];
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function badge(status){const [label,cls]=statuses[status]||[status||'未知','b-muted'];return `<span class="badge ${cls}">${esc(label)}</span>`;}
function clock(value){if(!value)return '-';const iso=String(value).replace(' ','T');const date=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso)?iso:iso+'Z');return Number.isNaN(+date)?'-':date.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Taipei'});}
function showPage(id){if(!pageTitles[id])id='overview';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+id));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===id));$('title').textContent=pageTitles[id];if(id==='analytics-page')loadTrends();if(history.replaceState)history.replaceState(null,'','#'+id);}
function renderElders(target,data,full=false){$(target).innerHTML=data.length?data.map(row=>`<tr><td><strong>${esc(row.name)}</strong></td>${full?`<td class="muted">${esc(row.phone||'-')}</td><td class="muted">${esc(row.address||'-')}</td>`:''}<td>${badge(row.today_status)}</td><td class="muted">${clock(row.responded_at)}</td></tr>`).join(''):`<tr><td colspan="${full?5:3}" class="empty">目前沒有資料</td></tr>`;}
function renderAlerts(rows){$('alert-count').textContent=rows.length+' 筆';$('alerts').innerHTML=rows.length?rows.map(row=>{const high=row.alert_type==='help_needed'||row.alert_type==='no_response_3h';const labels={help_needed:'主動求助',no_response_1h:'超過 1 小時未回應',no_response_3h:'超過 3 小時未回應'};return `<div class="alert-row"><span class="dot ${high?'high':''}"></span><div><strong>${esc(row.elderly)}</strong><p>${esc(labels[row.alert_type]||row.alert_type)}</p></div><time>${clock(row.created_at)}</time></div>`;}).join(''):'<div class="empty">目前沒有未解警報</div>';}
async function loadAll(){try{const [summary,elderRows,alerts]=await Promise.all([fetch('/api/dashboard/summary').then(r=>r.json()),fetch('/api/dashboard/elderly').then(r=>r.json()),fetch('/api/dashboard/alerts').then(r=>r.json())]);const cs=summary.checkin_summary||{};$('m-ok').textContent=cs.ok||0;$('m-risk').textContent=(cs.no_response||0)+(cs.help_needed||0);$('m-pending').textContent=cs.pending||0;$('m-alerts').textContent=summary.active_alerts||0;$('m-needs').textContent=summary.open_needs||0;$('m-resources').textContent=summary.available_resources||0;elders=elderRows;$('elderly-count').textContent=elders.length+' 位';renderElders('overview-elderly',elders);renderElders('elderly-body',elders,true);renderAlerts(alerts);const emergency=summary.mode==='emergency';$('mode').classList.toggle('emergency',emergency);$('mode-text').textContent=emergency?'緊急模式':'日常模式';$('stamp').textContent='更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}catch(error){$('stamp').textContent='讀取失敗';}}
async function loadTrends(){const body=$('trends-body');body.innerHTML='<tr><td colspan="8" class="empty">讀取中</td></tr>';try{const data=await fetch('/api/dashboard/trends?days=14').then(r=>r.json());body.innerHTML=data.days.map(row=>`<tr><td>${esc(row.date)}</td><td>${row.checkin_ok}</td><td>${row.checkin_no_response}</td><td>${row.checkin_help_needed}</td><td>${row.checkin_pending}</td><td>${row.alerts}</td><td>${row.needs}</td><td>${row.needs_fulfilled}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">目前沒有資料</td></tr>';}catch(error){body.innerHTML='<tr><td colspan="8" class="empty">趨勢讀取失敗</td></tr>';}}
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));
$('overview-search').addEventListener('input',event=>renderElders('overview-elderly',elders.filter(row=>row.name.includes(event.target.value))));
$('elderly-search').addEventListener('input',event=>{const q=event.target.value;renderElders('elderly-body',elders.filter(row=>row.name.includes(q)||(row.address||'').includes(q)),true);});
$('refresh').addEventListener('click',loadAll);
$('mode').addEventListener('click',async()=>{const next=$('mode').classList.contains('emergency')?'normal':'emergency';if(!confirm(next==='emergency'?'確定切換為緊急模式並通知 LINE 使用者？':'確定解除緊急模式？'))return;await fetch('/api/dashboard/mode?mode='+next,{method:'POST'});loadAll();});
$('rag-form').addEventListener('submit',async event=>{event.preventDefault();const button=$('rag-submit'),answer=$('rag-answer'),sources=$('rag-sources');button.disabled=true;button.textContent='查詢中';answer.hidden=false;answer.textContent='';sources.hidden=true;try{const response=await fetch('/api/rag/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('rag-question').value.trim()})});const data=await response.json();if(!response.ok)throw Error(data.detail||data.error||'查詢失敗');answer.textContent=data.answer||'目前沒有可用回答';const refs=(data.sources||[]).map(item=>typeof item==='string'?item:(item.source||item.title||'')).filter(Boolean);sources.textContent=refs.length?'來源：'+refs.join(' · '):'未回傳來源';sources.hidden=false;}catch(error){answer.textContent=error.message;}finally{button.disabled=false;button.textContent='查詢';}});
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data&&event.data.navigate)showPage(event.data.navigate);});
window.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();showPage(location.hash.slice(1)||'overview');loadAll();});
</script>
</body>
</html>
