<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄰里守望</title>
<script defer src="/static/vendor/lucide.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; letter-spacing:0 !important; }
:root {
  --bg:#f3f6f3; --sidebar:#181d1b; --border:#343e38; --primary:#77d6b5; --success:#77d6b5;
  --danger:#f5455c; --muted:#9aa69f; --text:#eef4f0; --text-dim:#b7c1bb;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --sans:'Inter',-apple-system,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;
}
html { color-scheme: light; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px; display:grid; grid-template-columns:220px minmax(0,1fr); height:100dvh; overflow:hidden; }
button { font:inherit; }
.sidebar { min-width:0; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; z-index:30; }
.logo { padding:20px 20px 16px; border-bottom:1px solid var(--border); }
.logo-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.logo h1 { font-size:15px; font-weight:750; }
.logo span { display:block; margin-top:3px; font-size:11px; color:var(--muted); font-family:var(--mono); }
.sec { padding:18px 16px 6px; font-size:11px; font-weight:700; color:var(--muted); font-family:var(--mono); }
.nav { display:flex; align-items:center; gap:10px; width:100%; padding:8px 16px; border:0; border-left:2px solid transparent; background:none;
       color:var(--text-dim); cursor:pointer; font:550 13px var(--sans); text-align:left; min-height:40px; }
.nav:hover { background:rgba(255,255,255,.03); color:var(--text); }
.nav.active { background:rgba(34,211,238,.08); color:var(--primary); border-left-color:var(--primary); }
.nav svg { width:17px; height:17px; flex-shrink:0; }
/* 事件處置是主要工作入口，和一般頁面分開、一眼看得到 */
.nav.nav-primary { margin:8px 12px 4px; width:calc(100% - 24px); min-height:46px; padding:8px 12px; border:1px solid rgba(249,115,22,.55); border-radius:6px;
       background:rgba(249,115,22,.14); color:#fed7aa; font-weight:750; font-size:14px; }
.nav.nav-primary svg { width:20px; height:20px; color:#fb923c; }
.nav.nav-primary:hover { background:rgba(249,115,22,.22); color:#fff; }
.nav.nav-primary.active { background:rgba(249,115,22,.28); color:#fff; border-color:#fb923c; }
.nav-alert { background:#dc2626; }
.nav-count { margin-left:auto; min-width:22px; padding:1px 7px; border-radius:11px; background:#ea580c; color:#fff; font:700 12px var(--mono); text-align:center; }
.bottom { margin-top:auto; padding:12px; border-top:1px solid var(--border); }
.mode-button { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:38px; padding:8px 10px; border-radius:4px; cursor:pointer;
        font:700 12px var(--sans); background:rgba(45,212,167,.08); color:var(--success); border:1px solid rgba(45,212,167,.3); }
.mode-button.emergency { background:rgba(245,69,92,.12); color:#ff7587; border-color:rgba(245,69,92,.55); }
.mode-indicator { width:9px; height:9px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px rgba(119,214,181,.12); flex:0 0 auto; }
.emergency .mode-indicator { box-shadow:0 0 0 3px rgba(245,69,92,.15); }
.app-main { min-width:0; height:100dvh; display:flex; flex-direction:column; }
.views { min-width:0; flex:1; min-height:0; }
.emergency-banner { flex:none; padding:8px 16px; background:#b52e42; color:#fff; font-size:14px; font-weight:600; }
.emergency-banner span { font-weight:400; opacity:.9; margin-left:8px; }
.views iframe { display:block; border:0; width:100%; height:100%; background:var(--bg); }
[hidden] { display:none !important; }
.mode-dialog { width:min(380px, calc(100vw - 32px)); padding:20px; border:0; border-radius:14px; color:#17201c; background:#fff; box-shadow:0 20px 50px rgba(0,0,0,.3); }
.mode-dialog::backdrop { background:rgba(10,14,12,.45); }
.mode-dialog h2 { font-size:17px; margin-bottom:8px; } .mode-dialog p { color:#4b5750; line-height:1.6; margin-bottom:18px; }
.mode-dialog .row { display:flex; justify-content:flex-end; gap:8px; }
.mode-dialog button { min-height:40px; padding:0 16px; border-radius:8px; border:1px solid #cfd8d2; background:#fff; color:#17201c; font-weight:600; cursor:pointer; }
.mode-dialog button.go { background:#c9364b; border-color:#c9364b; color:#fff; } .mode-dialog button.go.calm { background:#13795b; border-color:#13795b; }
.mobile-bar, .nav-scrim, .nav-close { display:none; }
@media (max-width:760px) {
  body { display:block; }
  .app-main { display:flex; flex-direction:column; }
  .mobile-bar { height:58px; padding:8px 10px; display:flex; align-items:center; gap:9px; background:#fff; color:#25342f; border-bottom:1px solid #dce3de; flex:0 0 auto; }
  .mobile-context { min-width:0; flex:1; }
  .mobile-context strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .mobile-context span { display:block; margin-top:2px; color:#5f6c65; font-size:11px; }
  .mobile-bar > button { border:1px solid #d4ddd7; border-radius:5px; background:#fff; color:#25342f; min-width:40px; min-height:40px; padding:7px; display:inline-flex; align-items:center; justify-content:center; }
  .mobile-bar svg { width:20px; height:20px; }
  #mobile-mode { width:auto; min-width:auto; gap:7px; padding:7px 10px; color:#076a5f; font-weight:700; }
  #mobile-mode.emergency { color:#b52e42; border-color:#e8a8b2; background:#fff1f3; }
  .views { flex:1; min-height:0; }
  .sidebar { position:fixed; inset:0 auto 0 0; width:min(304px,86vw); transform:translateX(-102%); transition:transform .2s ease; box-shadow:16px 0 36px rgba(0,0,0,.24); }
  .sidebar.open { transform:translateX(0); }
  .nav-close { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:0; border-radius:4px; background:transparent; color:var(--text-dim); cursor:pointer; }
  .nav-close svg { width:20px; height:20px; }
  .nav { min-height:44px; font-size:14px; }
  .nav-scrim { display:block; position:fixed; inset:0; z-index:20; border:0; background:rgba(14,24,20,.52); }
}
</style>
<link rel="stylesheet" href="/static/feel.css">
<script src="/static/feel.js"></script>
</head>
<body>
<button id="nav-scrim" class="nav-scrim" type="button" aria-label="關閉導覽" hidden></button>
<aside class="sidebar" id="sidebar" aria-label="主要導覽">
  <div class="logo"><div class="logo-row"><div><h1>鄰里守望</h1><span>社區照護與應變</span></div><button id="nav-close" class="nav-close" type="button" aria-label="關閉導覽"><i data-lucide="x"></i></button></div></div>
  <nav id="nav"></nav>
  <div class="bottom"><button id="mode" class="mode-button" type="button"><span class="mode-indicator" aria-hidden="true"></span><span id="mode-text">日常模式</span></button></div>
</aside>
<div class="app-main">
  <header class="mobile-bar">
    <button id="nav-toggle" type="button" aria-label="開啟導覽" aria-expanded="false" aria-controls="sidebar"><i data-lucide="menu"></i></button>
    <div class="mobile-context"><strong id="mobile-title">事件處置工作區</strong><span>鄰里守望</span></div>
    <button id="mobile-mode" class="mode-button" type="button"><span class="mode-indicator" aria-hidden="true"></span><span id="mobile-mode-text">日常模式</span></button>
  </header>
  <div id="emergency-banner" class="emergency-banner" role="status" hidden>🚨 緊急模式<span>每 30 分鐘自動媒合，派遣仍需人工核准</span></div>
  <div class="views" id="views"><iframe id="view" title="內容"></iframe></div>
</div>

<script src="/static/sos-alarm.js"></script>
<script>
(function () {
  var DASH = '/view/dashboard', CONSOLE = '/view/console';
  var NAV = [
    { sec: '事件處置' },
    { id: 'workspace', label: '事件處置工作區', icon: 'network', view: '/workspace', page: null },
    { id: 'sitrep', label: '災情摘要', icon: '📄', view: '/view/sitrep', page: null },
    { sec: '照護現況' },
    { id: 'overview', label: '總覽', icon: '📊', view: DASH, page: 'overview' },
    { id: 'elders', label: '長者狀態', icon: '👴', view: DASH, page: 'elderly' },
    { id: 'trends', label: '趨勢分析', icon: '📈', view: DASH, page: 'analytics-page' },
    { sec: '人員' },
    { id: 'members', label: '人員管理', icon: '🧓', view: CONSOLE, page: 'page-elderly' },
    { id: 'volunteers', label: '志工申請', icon: '🙋', view: CONSOLE, page: 'page-volunteers' },
    { id: 'relations', label: '照護關係', icon: '🔗', view: CONSOLE, page: 'page-relations' },
    { sec: '資料設定' },
    { id: 'supplies', label: '物資與資源點', icon: '📦', view: CONSOLE, page: 'page-needs' },
    { id: 'zones', label: '分區', icon: '🗺️', view: CONSOLE, page: 'page-zones' },
    { sec: '系統' },
    { id: 'audit', label: '操作紀錄', icon: '🧾', view: CONSOLE, page: 'page-audit' },
    { id: 'status', label: '系統狀態', icon: '🩺', view: CONSOLE, page: 'page-status' },
    { sec: '知識' },
    { id: 'ai', label: 'AI 助手', icon: '🤖', view: DASH, page: 'ai-page' },
    { id: 'kb', label: '知識庫', icon: '🧠', view: CONSOLE, page: 'page-kb' },
    { id: 'guide', label: '使用手冊', icon: '📘', view: '/guide', page: null }
  ];
  var frame = document.getElementById('view'), nav = document.getElementById('nav'), buttons = {}, frames = {}, currentId = null;
  var sidebar = document.getElementById('sidebar'), navToggle = document.getElementById('nav-toggle');
  var navScrim = document.getElementById('nav-scrim'), navClose = document.getElementById('nav-close');
  var iconNames={sitrep:'file-text',overview:'chart-no-axes-combined',elders:'heart-pulse',trends:'chart-line',members:'users',volunteers:'handshake',relations:'link',zones:'map-pinned',audit:'scroll-text',status:'activity',workspace:'siren',ai:'messages-square',kb:'book-open',supplies:'package',guide:'book-marked'};

  function setNav(open) {
    sidebar.classList.toggle('open', open);
    navScrim.hidden = !open;
    navToggle.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('nav-open', open);
    if (open) nav.querySelector('.nav.active, .nav')?.focus();
  }
  navToggle.addEventListener('click', function () { setNav(!sidebar.classList.contains('open')); });
  navClose.addEventListener('click', function () { setNav(false); navToggle.focus(); });
  navScrim.addEventListener('click', function () { setNav(false); navToggle.focus(); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') setNav(false); });

  NAV.forEach(function (item) {
    if (item.sec) {
      var s = document.createElement('div'); s.className = 'sec'; s.textContent = item.sec; nav.appendChild(s); return;
    }
    var b = document.createElement('button');
    b.type = 'button'; b.className = item.id === 'workspace' ? 'nav nav-primary' : 'nav'; b.title = item.label;
    var icon = document.createElement('i'); icon.setAttribute('data-lucide',iconNames[item.id]);
    var label = document.createElement('span'); label.className = 'label'; label.textContent = item.label;
    b.appendChild(icon); b.appendChild(label);
    if (item.id === 'status') {
      var alertCount = document.createElement('span'); alertCount.className = 'nav-count nav-alert'; alertCount.id = 'status-count';
      alertCount.hidden = true; alertCount.setAttribute('aria-hidden', 'true'); b.appendChild(alertCount);
    }
    if (item.id === 'workspace') {
      var count = document.createElement('span'); count.className = 'nav-count'; count.id = 'workspace-count'; count.hidden = true;
      count.setAttribute('aria-hidden', 'true');
      b.appendChild(count);
    }
    b.addEventListener('click', function () { go(item.id); setNav(false); });
    buttons[item.id] = { el: b, item: item };
    nav.appendChild(b);
  });

  function go(id) {
    var entry = buttons[id] || buttons.workspace;
    var item = entry.item;
    Object.keys(buttons).forEach(function (k) {
      var active = k === item.id;
      buttons[k].el.classList.toggle('active', active);
      if (active) buttons[k].el.setAttribute('aria-current', 'page');
      else buttons[k].el.removeAttribute('aria-current');
    });
    if(!frames[item.view]){
      var next=Object.keys(frames).length?document.createElement('iframe'):frame;
      next.title=item.label;next.setAttribute('data-view',item.view);
      next.src=item.view+'?embed=1'+(item.page?'#'+item.page:'');
      next.addEventListener('load',function(){if(currentId&&buttons[currentId].item.view===item.view)activate(next,buttons[currentId].item);});
      frames[item.view]=next;if(next!==frame)document.getElementById('views').appendChild(next);
    }
    Object.keys(frames).forEach(function(key){frames[key].hidden=key!==item.view;});
    frame=frames[item.view];currentId=item.id;activate(frame,item);
    try { history.replaceState(null, '', '#' + item.id); } catch (e) { /* ignore */ }
    document.title = item.label + '｜鄰里守望';
    document.getElementById('mobile-title').textContent = item.label;
  }
  // 求救橫幅按「查看」時要交給工作區的那一筆；工作區第一次載入時訊息可能還沒人收，載入完成會再送一次
  var pendingSos = null;
  function activate(target,item){if(!target.contentWindow)return;target.contentWindow.postMessage(item.page?{navigate:item.page}:{workspaceVisible:true},location.origin);
    if(item.id==='workspace'&&pendingSos){target.contentWindow.postMessage({focusNeed:pendingSos},location.origin);var sent=pendingSos;setTimeout(function(){if(pendingSos===sent)pendingSos=null;},10000);}}
  window.addEventListener('hashchange',function(){go(location.hash.slice(1));});
  window.addEventListener('message',function(e){if(e.origin!==location.origin||!Object.keys(frames).some(function(k){return frames[k].contentWindow===e.source;}))return;if(e.data&&buttons[e.data.navigate])go(e.data.navigate);});
  window.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});

  var pill = document.getElementById('mode'), mobilePill = document.getElementById('mobile-mode');
  function loadMode() {
    fetch('/api/dashboard/summary').then(function (r) { return r.json(); }).then(function (s) {
      var emergency = s.mode === 'emergency';
      pill.classList.toggle('emergency', emergency);
      mobilePill.classList.toggle('emergency', emergency);
      document.getElementById('emergency-banner').hidden = !emergency;
      var count = document.getElementById('workspace-count');
      var sos = s.open_sos || [];
      if (count) { count.hidden = !s.open_needs; count.textContent = s.open_needs || ''; count.classList.toggle('nav-alert', sos.length > 0); var ws = count.parentNode; if (ws) ws.title = '事件處置工作區' + (s.open_needs ? '（待處理需求 ' + s.open_needs + ' 筆' + (sos.length ? '，其中緊急求救 ' + sos.length + ' 筆' : '') + '）' : ''); }
      // 不管現在在哪一頁，有新的求救就響鈴；按「查看」直接跳到工作區那一筆。
      // 紅條放在緊急模式橫幅那一層、把內容往下推，手機上才不會蓋住選單按鈕
      if (window.sosAlarm) sosAlarm.before = document.getElementById('emergency-banner');
      // 已經有人受理的不再警示；工作區徽章仍算全部未結案的
      if (window.sosAlarm) sosAlarm.check(sos.filter(function (i) { return !i.responder; }), function (item) { pendingSos = 'db:need:' + item.id; go('workspace'); });
      document.getElementById('mode-text').textContent = emergency ? '緊急模式' : '日常模式';
      document.getElementById('mobile-mode-text').textContent = emergency ? '緊急模式' : '日常模式';
      pill.setAttribute('aria-label', emergency ? '目前為緊急模式，按下可解除' : '目前為日常模式，按下可啟動緊急模式');
      mobilePill.setAttribute('aria-label', pill.getAttribute('aria-label'));
    }).catch(function () { /* ignore */ });
  }
  function toggleMode() {
    var next = pill.classList.contains('emergency') ? 'normal' : 'emergency';
    var dialog = document.getElementById('mode-dialog'), go = document.getElementById('mode-go');
    document.getElementById('mode-dialog-title').textContent = next === 'emergency' ? '切換為緊急模式？' : '解除緊急模式？';
    document.getElementById('mode-dialog-text').textContent = next === 'emergency'
      ? '所有 LINE 使用者都會收到緊急模式通知。' : '社區會恢復日常模式，LINE 使用者會收到解除通知。';
    go.textContent = next === 'emergency' ? '啟動緊急模式' : '解除';
    go.className = next === 'emergency' ? 'go' : 'go calm';
    dialog.onclose = function () {
      if (dialog.returnValue !== 'go') return;
      fetch('/api/dashboard/mode?mode=' + next, { method: 'POST' }).then(loadMode)
        .catch(function () { if (window.feelToast) feelToast('切換失敗，請再試一次', 'danger'); });
    };
    dialog.returnValue = '';
    dialog.showModal();
    go.focus();
  }
  pill.addEventListener('click', toggleMode);
  mobilePill.addEventListener('click', toggleMode);
  loadMode();
  // 系統狀態有「需處理」時在選單上亮紅色數字；LINE 檢查有快取，5 分鐘一次夠了。
  function loadStatusBadge() {
    fetch('/api/system/status').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      var badge = document.getElementById('status-count');
      if (!badge || !s) return;
      badge.hidden = !s.error; badge.textContent = s.error || '';
      var btn = badge.parentNode; if (btn) btn.title = '系統狀態' + (s.error ? '（' + s.error + ' 項需處理）' : '');
    }).catch(function () { /* ignore */ });
  }
  loadStatusBadge();
  setInterval(loadStatusBadge, 300000);
  setInterval(loadMode, 30000);

  go(location.hash.slice(1) || 'workspace');
})();
</script>
<dialog id="mode-dialog" class="mode-dialog" aria-labelledby="mode-dialog-title">
  <form method="dialog">
    <h2 id="mode-dialog-title"></h2>
    <p id="mode-dialog-text"></p>
    <div class="row"><button value="cancel">取消</button><button id="mode-go" value="go" class="go"></button></div>
  </form>
</dialog>
</body>
</html>
